<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botanical Art — 30 Days</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400;700&display=swap');

:root {
  --bg: #f7f3ec;
  --paper: #fffef9;
  --ink: #1e1c18;
  --mid: #5a5448;
  --muted: #9a9080;
  --line: #e0d8cc;
  --green: #4a7c5c;
  --green-bg: #eef5f0;
  --accent: #8b4a2f;
  --gold: #b8903a;
  --done-bg: #f0f5f0;
  --radius: 6px;
  /* tab 2 accent — warm terracotta/figure */
  --fig: #7a4a8a;
  --fig-bg: #f5f0f8;
  --fig-done: #f0ecf5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'Lato', sans-serif;
  color: var(--ink);
  min-height: 100vh;
}

/* ── TAB BAR ── */
.tab-bar {
  background: var(--ink);
  display: flex;
  align-items: flex-end;
  padding: 0 2rem;
  gap: .3rem;
}

.tab-btn {
  font-family: 'Playfair Display', serif;
  font-size: .88rem;
  font-style: italic;
  padding: .7rem 1.4rem .6rem;
  border: none;
  background: transparent;
  color: #6a6458;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: #c8a882; }
.tab-btn.active { color: #c8a882; border-bottom-color: #c8a882; }

/* ── HEADER ── */
.tab-header {
  background: var(--ink);
  color: var(--bg);
  padding: 1.5rem 2.5rem 1.8rem;
  text-align: center;
}

.tab-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: .04em;
  line-height: 1.2;
}

.tab-header h1 em { font-style: italic; color: #c8a882; }
.tab-header h1 em.fig { color: #c8a0d8; }

.tab-header p {
  margin-top: .5rem;
  font-size: .78rem;
  color: #8a8070;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.progress-bar-wrap {
  margin-top: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .8rem;
}

.progress-bar {
  width: 220px;
  height: 3px;
  background: #2e2c28;
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: #c8a882;
  border-radius: 99px;
  transition: width .4s ease;
}

.progress-fill.fig { background: #c8a0d8; }

.progress-label {
  font-size: .72rem;
  color: #8a8070;
  letter-spacing: .06em;
}

/* ── TAB PANELS ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── FILTER ── */
.controls {
  padding: .8rem 2rem;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: .5rem;
  align-items: center;
  flex-wrap: wrap;
}

.filter-btn {
  font-family: 'Lato', sans-serif;
  font-size: .7rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  padding: .3rem .85rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--ink); color: var(--ink); }
.filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.done-count {
  margin-left: auto;
  font-size: .75rem;
  color: var(--muted);
  font-style: italic;
}

/* ── GRID ── */
.grid {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem 1.5rem 3rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 1rem;
}

/* ── CARD ── */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: .6rem;
  transition: border-color .15s, background .2s, opacity .2s;
  position: relative;
}

.card.done { background: var(--done-bg); border-color: #c8d8c8; }
.card.done-fig { background: var(--fig-done); border-color: #c8a0d8; }
.card.hidden { display: none; }

.day-badge {
  position: absolute;
  top: .9rem; right: 1rem;
  font-size: .62rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}
.card.done .day-badge { color: var(--green); }
.card.done-fig .day-badge { color: var(--fig); }

/* ── CARD ARTIST ── */
.card-artist { padding-right: 2.5rem; }
.card-artist a {
  font-family: 'Playfair Display', serif;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  transition: border-color .15s, color .15s;
  line-height: 1.3;
}
.card-artist a:hover { color: var(--accent); border-color: var(--accent); }
.card.done .card-artist a { color: var(--green); border-color: #c8d8c8; }
.card.done-fig .card-artist a { color: var(--fig); border-color: #c8a0d8; }

/* ── PLANT PAIRING ── */
.card-plant {
  display: flex;
  align-items: baseline;
  gap: .5rem;
}
.plant-icon { font-size: .9rem; flex-shrink: 0; }
.plant-name {
  font-size: .82rem;
  font-weight: 700;
  color: var(--green);
  font-style: italic;
}
.plant-name.fig { color: var(--fig); }
.plant-reason { font-size: .72rem; color: var(--mid); line-height: 1.4; }

/* ── FOCUS TAGS ── */
.card-tags {
  display: flex;
  gap: .3rem;
  flex-wrap: wrap;
}
.tag {
  font-size: .6rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  padding: .15rem .5rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-weight: 700;
}
.tag.anatomy { border-color: #c8a882; color: #8b6a2f; background: #fdf6ec; }
.tag.figure  { border-color: #c8a0d8; color: var(--fig); background: var(--fig-bg); }
.tag.portrait{ border-color: #a8c0c8; color: #2f6a7a; background: #ecf5f8; }
.tag.comp    { border-color: #c8c8a0; color: #6a6a2f; background: #f8f8ec; }
.tag.plant   { border-color: #a0c8b0; color: var(--green); background: var(--green-bg); }

/* ── LINKS ── */
.card-links { display: flex; gap: .4rem; flex-wrap: wrap; }
.link-pill {
  font-size: .65rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: .2rem .6rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--muted);
  text-decoration: none;
  transition: all .12s;
  white-space: nowrap;
}
.link-pill:hover { border-color: var(--accent); color: var(--accent); }
.link-pill.plant { border-color: #c8d8c8; color: var(--green); }
.link-pill.plant:hover { background: var(--green-bg); }
.link-pill.fig-link { border-color: #c8a0d8; color: var(--fig); }
.link-pill.fig-link:hover { background: var(--fig-bg); }

/* ── TASK ── */
.card-task {
  font-size: .75rem;
  color: var(--mid);
  font-style: italic;
  line-height: 1.45;
  padding-top: .2rem;
  border-top: 1px solid var(--line);
}
.card-task strong {
  color: var(--ink);
  font-style: normal;
  font-size: .7rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* ── TIP ── */
.card-tip {
  font-size: .7rem;
  color: var(--gold);
  font-style: italic;
  padding: .25rem .5rem;
  border-left: 2px solid var(--gold);
  background: #fdf8ec;
  border-radius: 0 3px 3px 0;
}

/* ── CHECKBOX ── */
.card-check {
  display: flex;
  align-items: center;
  gap: .5rem;
  cursor: pointer;
  user-select: none;
  margin-top: .1rem;
}
.check-box {
  width: 18px; height: 18px;
  border: 1.5px solid var(--line);
  border-radius: 3px;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: .75rem;
  flex-shrink: 0;
  transition: all .15s;
}
.card.done .check-box { background: var(--green); border-color: var(--green); color: white; }
.card.done-fig .check-box { background: var(--fig); border-color: var(--fig); color: white; }
.check-label { font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card.done .check-label { color: var(--green); }
.card.done-fig .check-label { color: var(--fig); }
</style>
</head>

function searchUrl(q) {
  return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
}

// ── RENDER TAB 1 ──
const done1 = new Set(JSON.parse(localStorage.getItem('bot30_done1') || '[]'));
let filter1 = 'all';

function updateProgress1() {
  const n = done1.size;
  document.getElementById('progressFill1').style.width = (n/30*100) + '%';
  document.getElementById('progressLabel1').textContent = n + ' / 30';
  document.getElementById('doneCount1').textContent = n===30 ? '🎉 Alle 30 Tage!' : n>0 ? `${n} erledigt` : '';
  localStorage.setItem('bot30_done1', JSON.stringify([...done1]));
}

function applyFilter1() {
  document.querySelectorAll('#grid1 .card').forEach(c => {
    const d = c.classList.contains('done');
    c.classList.toggle('hidden', filter1==='done'? !d : filter1==='todo'? d : false);
  });
}

function renderTab1() {
  const grid = document.getElementById('grid1');
  DAYS1.forEach((day, idx) => {
    const n = idx+1, isDone = done1.has(n);
    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="day-badge">Day ${n}</div>
      <div class="card-artist"><a href="${searchUrl(day.artistSearch)}" target="_blank" rel="noopener">${day.artist}</a></div>
      <div class="card-plant">
        <span class="plant-icon">🌿</span>
        <div>
          <div class="plant-name">${day.plant}</div>
          <div class="plant-reason">${day.plantReason}</div>
        </div>
      </div>
      <div class="card-links">
        <a class="link-pill" href="${searchUrl(day.artistSearch)}" target="_blank" rel="noopener">↗ Artist</a>
        <a class="link-pill plant" href="${searchUrl(day.plantSearch)}" target="_blank" rel="noopener">🌿 Pflanze</a>
        <a class="link-pill" href="${searchUrl(day.artistSearch+' museum collection')}" target="_blank" rel="noopener">🖼 Museum</a>
      </div>
      ${day.task ? `<div class="card-task"><strong>Aufgabe</strong> — ${day.task}</div>` : ''}
      <div class="card-check">
        <div class="check-box">${isDone?'✓':''}</div>
        <span class="check-label">${isDone?'Erledigt':'Als erledigt markieren'}</span>
      </div>`;
    card.querySelector('.card-check').addEventListener('click', () => {
      if (done1.has(n)) { done1.delete(n); card.classList.remove('done'); card.querySelector('.check-box').textContent=''; card.querySelector('.check-label').textContent='Als erledigt markieren'; }
      else { done1.add(n); card.classList.add('done'); card.querySelector('.check-box').textContent='✓'; card.querySelector('.check-label').textContent='Erledigt'; }
      updateProgress1(); applyFilter1();
    });
    grid.appendChild(card);
  });
  updateProgress1();
}

      else { done2.add(n); card.classList.add('done-fig'); card.querySelector('.check-box').textContent='✓'; card.querySelector('.check-label').textContent='Erledigt'; }

// ── TABS ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  });
});

// ── FILTERS ──
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const target = btn.dataset.tabTarget;
    document.querySelectorAll(`[data-tab-target="${target}"].filter-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (target === 'tab1') { filter1 = btn.dataset.filter; applyFilter1(); }
    else { filter2 = btn.dataset.filter; applyFilter2(); }
  });
});

// ── INIT ──
