<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elvanse Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f7f4;color:#1a1a18;font-size:14px;line-height:1.5}
.app{max-width:1100px;margin:0 auto;padding:1.2rem 1rem}
h1{font-size:18px;font-weight:600;margin-bottom:2px}
.subtitle{font-size:12px;color:#999;margin-bottom:1.2rem}
.nav{display:flex;gap:8px;margin-bottom:1rem;align-items:center;flex-wrap:wrap}
.nav-btn{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#444;cursor:pointer}
.nav-btn.active{background:#e8f5ee;border-color:#1D9E75;color:#0F6E56;font-weight:500}
.week-nav{display:flex;gap:5px;align-items:center;margin-left:auto}
.week-label{font-size:12px;color:#777;min-width:100px;text-align:center}
.stats-row{display:flex;gap:8px;margin-bottom:1.2rem;flex-wrap:wrap}
.stat-card{background:#fff;border:1px solid #e8e8e4;border-radius:9px;padding:8px 14px;flex:1;min-width:70px}
.stat-num{font-size:20px;font-weight:600}
.stat-label{font-size:10px;color:#aaa;margin-top:1px}

/* Week grid */
.week-table{width:100%;border-collapse:separate;border-spacing:3px}
.week-table th{font-size:10px;color:#aaa;font-weight:500;text-align:center;padding:3px 2px}
.week-table th.today-h{color:#0F6E56;font-weight:700}
.week-table td{vertical-align:middle;padding:1px 0}
.habit-col{font-size:12px;color:#333;padding-right:6px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.habit-col-inner{display:flex;align-items:center;gap:5px}
.streak-badge{font-size:9px;padding:1px 5px;border-radius:8px;background:#c0dd97;color:#27500A;font-weight:700;flex-shrink:0}
.cell{width:26px;height:26px;border:1px solid #e0e0da;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff;user-select:none;margin:0 auto}
.cell:hover{border-color:#aaa}
.cell.full{background:#9FE1CB;border-color:#1D9E75;color:#085041;font-weight:700}
.cell.half{background:#C0DD97;border-color:#639922;color:#27500A;font-weight:700}
.cell.off{background:#f0efea;border-color:#ccc;color:#bbb;border-style:dashed}
.cell.no{background:#fdf0f0;border-color:#f09595;color:#c0607a}
.cell.menstrual{box-shadow:inset 0 0 0 2px #f09595}
.section-row td{padding-top:8px;padding-bottom:1px}
.section-label-cell{font-size:9px;color:#ccc;text-transform:uppercase;letter-spacing:0.6px}

/* Extra columns */
.col-elva select{font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#333;width:62px}
.col-stress{display:flex;gap:2px;align-items:center;justify-content:center}
.sdot{width:11px;height:11px;border-radius:50%;border:1px solid #ddd;cursor:pointer;background:#fff}
.sdot.a{background:#E24B4A;border-color:#A32D2D}
.col-weight input{width:56px;font-size:11px;padding:2px 5px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#333;text-align:right}
.col-note input{width:110px;font-size:11px;padding:2px 6px;border:1px solid #ddd;border-radius:5px;background:#fff;color:#333}
.col-header{font-size:10px;color:#aaa;font-weight:500;text-align:center;padding:3px 4px;white-space:nowrap}

.add-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.add-row input{flex:1;font-size:12px;padding:5px 8px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333}
button{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;cursor:pointer}
button:hover{background:#f0f0ea}
.legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#aaa}
.leg-dot{width:13px;height:13px;border-radius:4px;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:9px}

/* Month */
.month-grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:3px}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.month-cell{background:#fff;border:1px solid #e8e8e4;border-radius:8px;padding:5px;min-height:60px;cursor:pointer;position:relative;overflow:hidden}
.month-cell:hover{border-color:#aaa}
.month-cell.selected{border-color:#1D9E75;border-width:2px}
.month-cell.today-cell{background:#f0faf5}
.month-num{font-size:10px;color:#bbb;margin-bottom:2px}
.month-num.tn{color:#0F6E56;font-weight:700}
.month-dots{display:flex;flex-wrap:wrap;gap:2px}
.mdot{width:6px;height:6px;border-radius:50%}
.mdot.full{background:#1D9E75}
.mdot.half{background:#639922}
.mdot.no{background:#f09595}
.menses-bar{position:absolute;top:0;left:0;right:0;height:3px;background:#E24B4A;border-radius:8px 8px 0 0}
.pred-bar{position:absolute;top:0;left:0;right:0;height:3px;background:#f09595;border-radius:8px 8px 0 0;opacity:0.5}

/* Detail + Cycle panels */
.panel{background:#fff;border:1px solid #e8e8e4;border-radius:11px;padding:1rem 1.2rem;margin-top:1rem}
.panel-title{font-size:13px;font-weight:600;margin-bottom:10px}
.drow{display:flex;gap:10px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.dlabel{font-size:11px;color:#aaa;min-width:80px}
textarea.note-full{width:100%;font-size:12px;padding:6px 8px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#333;resize:vertical;min-height:55px;font-family:inherit}
.cycle-section{background:#fff;border:1px solid #f7c1c1;border-radius:11px;padding:1rem 1.2rem;margin-top:1rem}
.cycle-title{font-size:13px;font-weight:600;margin-bottom:10px;color:#A32D2D}
.del-btn{font-size:10px;color:#ddd;cursor:pointer;padding:1px 5px;border:none;background:none}
.del-btn:hover{color:#E24B4A}
.pill{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:500}
.pill-20{background:#C0DD97;color:#27500A}
.pill-30{background:#9FE1CB;color:#085041}
.pill-no{background:#e8e8e4;color:#888}
</style>
</head>
<body>
<div class="app">
  <h1>🌿 Elvanse Tracker</h1>
  <div class="subtitle" id="subtitle"></div>
  <div class="nav">
    <button class="nav-btn" id="btn-week" onclick="setView('week')">Woche</button>
    <button class="nav-btn" id="btn-month" onclick="setView('month')">Monat</button>
    <div class="week-nav" id="week-nav">
      <button onclick="changeWeek(-1)">‹</button>
      <span class="week-label" id="week-label"></span>
      <button onclick="changeWeek(1)">›</button>
      <button onclick="goToday()" style="font-size:10px;padding:3px 7px">heute</button>
    </div>
    <div id="month-nav" style="display:none;margin-left:auto;display:flex;gap:6px;align-items:center">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="month-label" style="font-size:12px;color:#777;min-width:110px;text-align:center"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="stats-row" id="stats"></div>
  <div id="main"></div>
  <div id="detail"></div>
  <div id="cycle"></div>
</div>

<script>
const HABITS_DEFAULT=[
  {id:'yoga',name:'Yoga',group:'Bewegung'},
  {id:'ballet',name:'Ballett',group:'Bewegung'},
  {id:'sport',name:'Sport*',group:'Bewegung'},
  {id:'journal',name:'Journal',group:'Mind'},
  {id:'klavier',name:'Klavier',group:'Mind'},
  {id:'lesen',name:'Lesen',group:'Mind'},
  {id:'draw',name:'Draw',group:'Kreativ'},
  {id:'artstudies',name:'Art studies',group:'Kreativ'},
  {id:'work',name:'Work/Proj',group:'Arbeit'},
];
const STATES=['empty','full','half','off','no'];
const ICONS={empty:'',full:'✓',half:'◐',off:'○',no:'✕'};
const LABELS={empty:'?',full:'gemacht',half:'halb',off:'frei',no:'nicht gemacht'};
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const DS=['So','Mo','Di','Mi','Do','Fr','Sa'];

let db=load();
let view='week';
let weekOff=0;
let monthOff=0;
let selDay=null;

function load(){
  try{const r=localStorage.getItem('elvanse_v3');if(r)return JSON.parse(r);}catch(e){}
  return{days:{},habits:HABITS_DEFAULT.map(h=>({...h})),startDate:'2026-03-28',cycle:{avgLength:28,entries:[]}};
}
function save(){try{localStorage.setItem('elvanse_v3',JSON.stringify(db));}catch(e){}}
function today(){return fmt(new Date());}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function getMonday(d){const dt=new Date(d);const day=dt.getDay();const diff=dt.getDate()-day+(day===0?-6:1);return new Date(dt.setDate(diff));}
function weekDays(off){
  const b=new Date();b.setDate(b.getDate()+off*7);
  const mon=getMonday(b);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return fmt(d);});
}
function dayLbl(ds){const d=parse(ds);return`${DS[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}`;}
function shortLbl(ds){const d=parse(ds);return`${DS[d.getDay()]}<br>${d.getDate()}.${d.getMonth()+1}`;}

function getStreak(hid){
  let s=0,d=new Date();
  while(s<500){
    const ds=fmt(d);const val=(db.days[ds]||{})[hid]||'empty';
    if(val==='full'||val==='half'){s++;d.setDate(d.getDate()-1);}
    else if(val==='off'){d.setDate(d.getDate()-1);}
    else break;
  }
  return s;
}
function elvaDays(){return Object.values(db.days).filter(d=>d.elva&&d.elva!=='none'&&d.elva!=='no').length;}
function isMenses(ds){
  return(db.cycle.entries||[]).some(e=>{
    const s=parse(e.start),en=new Date(s);en.setDate(en.getDate()+(e.duration||5)-1);
    const c=parse(ds);return c>=s&&c<=en;
  });
}
function predicted(){
  const ents=db.cycle.entries||[];
  if(!ents.length)return[];
  const sorted=[...ents].sort((a,b)=>a.start.localeCompare(b.start));
  const last=sorted[sorted.length-1];
  const avg=db.cycle.avgLength||28;
  const ns=new Date(parse(last.start));ns.setDate(ns.getDate()+avg);
  const ne=new Date(ns);ne.setDate(ne.getDate()+(last.duration||5)-1);
  const dates=[];let d=new Date(ns);
  while(d<=ne){dates.push(fmt(d));d.setDate(d.getDate()+1);}
  return dates;
}

function toggle(hid,ds,right){
  if(!db.days[ds])db.days[ds]={};
  const cur=db.days[ds][hid]||'empty';
  if(right){db.days[ds][hid]=cur==='no'?'empty':'no';}
  else{const order=['empty','full','half','off'];const idx=order.indexOf(cur);db.days[ds][hid]=order[(idx+1)%order.length];}
  save();render();
}
function setProp(ds,key,val){if(!db.days[ds])db.days[ds]={};db.days[ds][key]=val;save();}
function toggleMenses(ds){
  if(!db.cycle.entries)db.cycle.entries=[];
  const idx=db.cycle.entries.findIndex(e=>e.start===ds);
  if(idx>=0){db.cycle.entries.splice(idx,1);}
  else{
    db.cycle.entries.push({start:ds,duration:5});
    db.cycle.entries.sort((a,b)=>a.start.localeCompare(b.start));
    const sorted=[...db.cycle.entries].sort((a,b)=>a.start.localeCompare(b.start));
    let tot=0,cnt=0;
    for(let i=1;i<sorted.length;i++){
      const diff=Math.round((parse(sorted[i].start)-parse(sorted[i-1].start))/(86400000));
      if(diff>10&&diff<60){tot+=diff;cnt++;}
    }
    if(cnt>0)db.cycle.avgLength=Math.round(tot/cnt);
  }
  save();render();
}
function addHabit(){
  const inp=document.getElementById('new-habit');
  const name=inp.value.trim();if(!name)return;
  db.habits.push({id:'c_'+Date.now(),name,group:'Eigene'});
  inp.value='';save();render();
}
function delHabit(id){if(!confirm('Löschen?'))return;db.habits=db.habits.filter(h=>h.id!==id);save();render();}
function setView(v){view=v;selDay=null;render();}
function changeWeek(n){weekOff+=n;render();}
function changeMonth(n){monthOff+=n;render();}
function goToday(){weekOff=0;render();}

function renderStats(){
  const t=today();
  const sd=db.startDate?parse(db.startDate):parse('2026-03-28');
  const dn=Math.max(1,Math.round((parse(t)-sd)/86400000)+1);
  document.getElementById('subtitle').textContent=`Tag ${dn} · ${t}`;
  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><div class="stat-num">${elvaDays()}</div><div class="stat-label">Elvanse-Tage</div></div>
    <div class="stat-card"><div class="stat-num">${Object.keys(db.days).length}</div><div class="stat-label">Tage getrackt</div></div>
    ${db.cycle.avgLength?`<div class="stat-card"><div class="stat-num">${db.cycle.avgLength}</div><div class="stat-label">Ø Zyklus</div></div>`:''}
  `;
}

function renderWeek(){
  const days=weekDays(weekOff);
  const f=d=>`${parse(d).getDate()}.${parse(d).getMonth()+1}`;
  document.getElementById('week-label').textContent=`${f(days[0])} – ${f(days[6])}`;
  document.getElementById('week-nav').style.display='flex';
  document.getElementById('month-nav').style.display='none';
  const pred=predicted();
  let groups={};
  db.habits.forEach(h=>{if(!groups[h.group])groups[h.group]=[];groups[h.group].push(h);});

  let html=`<div style="overflow-x:auto"><table class="week-table">
  <thead><tr>
    <th style="text-align:left;min-width:110px">Habit</th>
    ${days.map(ds=>`<th class="${ds===today()?'today-h':''}">${shortLbl(ds)}</th>`).join('')}
  </tr></thead><tbody>`;

  Object.entries(groups).forEach(([grp,habits])=>{
    html+=`<tr class="section-row"><td class="section-label-cell" colspan="8">${grp}</td></tr>`;
    habits.forEach(h=>{
      const streak=getStreak(h.id);
      html+=`<tr>
        <td class="habit-col"><div class="habit-col-inner">
          <span title="${h.name}">${h.name}</span>
          ${streak>=2?`<span class="streak-badge">${streak}</span>`:''}
          ${h.group==='Eigene'?`<button class="del-btn" onclick="delHabit('${h.id}')">✕</button>`:''}
        </div></td>
        ${days.map(ds=>{
          const val=(db.days[ds]||{})[h.id]||'empty';
          const mens=isMenses(ds);
          return`<td><div class="cell ${val}${mens?' menstrual':''}" 
            onclick="toggle('${h.id}','${ds}',false)"
            oncontextmenu="event.preventDefault();toggle('${h.id}','${ds}',true)"
            title="${dayLbl(ds)}: ${LABELS[val]}">${ICONS[val]}</div></td>`;
        }).join('')}
      </tr>`;
    });
  });

  html+=`<tr class="section-row"><td class="section-label-cell" colspan="8">Tagesinfos</td></tr>`;
  html+=`<tr>
    <td class="habit-col"><span style="color:#c0607a">🌸 Mens.</span></td>
    ${days.map(ds=>{
      const m=isMenses(ds);const p=pred.includes(ds);
      return`<td><div class="cell${m?' menstrual':''}" 
        style="background:${m?'#f7c1c1':p?'#fbeaf0':'#fff'};border-color:${m?'#E24B4A':p?'#f09595':'#e0e0da'}"
        onclick="toggleMenses('${ds}')" title="${m?'Mens. markiert':p?'vorhergesagt':''}">${m?'🩸':p?'·':''}</div></td>`;
    }).join('')}
  </tr>`;

  html+=`<tr>
    <td class="habit-col" style="color:#888;font-size:10px">Elvanse</td>
    ${days.map(ds=>{
      const d=db.days[ds]||{};
      return`<td style="text-align:center;padding:2px 1px">
        <select style="font-size:10px;padding:1px 2px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;width:100%"
          onchange="setProp('${ds}','elva',this.value);render()">
          <option value="none" ${(!d.elva||d.elva==='none')?'selected':''}>—</option>
          <option value="20" ${d.elva==='20'?'selected':''}>20</option>
          <option value="30" ${d.elva==='30'?'selected':''}>30</option>
          <option value="no" ${d.elva==='no'?'selected':''}>∅</option>
        </select>
      </td>`;
    }).join('')}
  </tr>
  <tr>
    <td class="habit-col" style="color:#888;font-size:10px">Stress</td>
    ${days.map(ds=>{
      const d=db.days[ds]||{};
      return`<td style="padding:2px 1px">
        <div class="col-stress">
          ${[1,2,3,4,5].map(n=>`<div class="sdot ${(d.stress||0)>=n?'a':''}" onclick="setProp('${ds}','stress',${(d.stress||0)===n?0:n});render()" title="${n}"></div>`).join('')}
        </div>
      </td>`;
    }).join('')}
  </tr>
  <tr>
    <td class="habit-col" style="color:#888;font-size:10px">Gewicht kg</td>
    ${days.map(ds=>{
      const d=db.days[ds]||{};
      return`<td style="padding:2px 1px">
        <input type="number" step="0.1" placeholder="—" value="${d.weight||''}"
          onchange="setProp('${ds}','weight',this.value)"
          style="width:100%;font-size:10px;padding:2px 3px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333;text-align:center">
      </td>`;
    }).join('')}
  </tr>
  <tr>
    <td class="habit-col" style="color:#888;font-size:10px">Notiz</td>
    ${days.map(ds=>{
      const d=db.days[ds]||{};
      return`<td style="padding:2px 1px">
        <input type="text" placeholder="..." value="${(d.note||'').replace(/"/g,'&quot;')}"
          onchange="setProp('${ds}','note',this.value)"
          title="${d.note||''}"
          style="width:100%;font-size:10px;padding:2px 4px;border:1px solid #ddd;border-radius:4px;background:#fff;color:#333">
      </td>`;
    }).join('')}
  </tr>
  </tbody></table></div>`;

  html+=`<div class="add-row">
    <input id="new-habit" placeholder="Neue Gewohnheit hinzufügen..." onkeydown="if(event.key==='Enter')addHabit()">
    <button onclick="addHabit()">+ Hinzufügen</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="leg-dot" style="background:#9FE1CB;border-color:#1D9E75">✓</div>gemacht</div>
    <div class="legend-item"><div class="leg-dot" style="background:#C0DD97;border-color:#639922">◐</div>halb</div>
    <div class="legend-item"><div class="leg-dot" style="background:#f0efea;border-style:dashed">○</div>frei</div>
    <div class="legend-item"><div class="leg-dot" style="background:#fdf0f0;border-color:#f09595">✕</div>nicht gemacht</div>
    <div class="legend-item"><div class="leg-dot"></div>? (unbekannt)</div>
    <div style="font-size:10px;color:#ccc;margin-left:8px">Linksklick = durchschalten · Rechtsklick = nicht gemacht</div>
  </div>`;

  document.getElementById('main').innerHTML=html;
}

function renderMonth(){
  document.getElementById('week-nav').style.display='none';
  const mn=document.getElementById('month-nav');mn.style.display='flex';
  const b=new Date();b.setMonth(b.getMonth()+monthOff);
  const year=b.getFullYear(),month=b.getMonth();
  document.getElementById('month-label').textContent=`${MONTHS[month]} ${year}`;
  const firstDay=new Date(year,month,1),lastDay=new Date(year,month+1,0);
  const pred=predicted();
  let html=`<div class="month-grid-header">
    ${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div style="font-size:10px;color:#bbb;text-align:center;padding:3px 0">${d}</div>`).join('')}
  </div><div class="month-grid">`;
  let sp=(firstDay.getDay()||7)-1;
  for(let i=0;i<sp;i++)html+=`<div></div>`;
  for(let d=1;d<=lastDay.getDate();d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dd=db.days[ds]||{};
    const isSel=selDay===ds,isTod=ds===today();
    const mens=isMenses(ds),p=pred.includes(ds);
    const done=db.habits.filter(h=>['full','half','no'].includes(dd[h.id]||'empty'));
    html+=`<div class="month-cell ${isSel?'selected':''} ${isTod?'today-cell':''}" onclick="selDay='${ds}';renderDetail();renderCycle()">
      ${mens?'<div class="menses-bar"></div>':p?'<div class="pred-bar"></div>':''}
      <div class="month-num ${isTod?'tn':''}">${d}${dd.elva&&dd.elva!=='none'?`<span style="font-size:8px;color:${dd.elva==='no'?'#ccc':'#0F6E56'}"> ${dd.elva==='no'?'∅':dd.elva}</span>`:''}</div>
      <div class="month-dots">${done.slice(0,9).map(h=>`<div class="mdot ${dd[h.id]||'empty'}" title="${h.name}"></div>`).join('')}</div>
    </div>`;
  }
  html+=`</div>`;
  document.getElementById('main').innerHTML=html;
}

function renderDetail(){
  if(!selDay){document.getElementById('detail').innerHTML='';return;}
  const ds=selDay,d=db.days[ds]||{};
  document.getElementById('detail').innerHTML=`
    <div class="panel">
      <div class="panel-title">📋 ${dayLbl(ds)}${ds===today()?' · heute':''}</div>
      <div class="drow">
        <span class="dlabel">Elvanse</span>
        <select onchange="setProp('${ds}','elva',this.value);render()">
          <option value="none" ${(!d.elva||d.elva==='none')?'selected':''}>—</option>
          <option value="20" ${d.elva==='20'?'selected':''}>20mg</option>
          <option value="30" ${d.elva==='30'?'selected':''}>30mg</option>
          <option value="no" ${d.elva==='no'?'selected':''}>Elva-frei</option>
        </select>
        ${d.elva==='20'?'<span class="pill pill-20">20mg</span>':d.elva==='30'?'<span class="pill pill-30">30mg</span>':d.elva==='no'?'<span class="pill pill-no">elva-frei</span>':''}
      </div>
      <div class="drow">
        <span class="dlabel">Stress</span>
        <div class="col-stress" style="gap:4px">
          ${[1,2,3,4,5].map(n=>`<div class="sdot" style="width:16px;height:16px;${(d.stress||0)>=n?'background:#E24B4A;border-color:#A32D2D':''}" onclick="setProp('${ds}','stress',${(d.stress||0)===n?0:n});renderDetail()"></div>`).join('')}
        </div>
        <span style="font-size:11px;color:#aaa;margin-left:5px">${d.stress||0}/5</span>
      </div>
      <div class="drow">
        <span class="dlabel">Gewicht</span>
        <input type="number" step="0.1" placeholder="kg" value="${d.weight||''}" onchange="setProp('${ds}','weight',this.value)" style="width:80px;font-size:12px;padding:4px 6px;border:1px solid #ddd;border-radius:7px">
      </div>
      <div class="drow" style="flex-direction:column;align-items:flex-start;gap:5px">
        <span class="dlabel">Notiz / Kontext</span>
        <textarea class="note-full" placeholder="Termine, Stress, Gefühle, Besonderes..." 
          onchange="setProp('${ds}','note',this.value)"
          onblur="setProp('${ds}','note',this.value)">${d.note||''}</textarea>
      </div>
    </div>`;
}

function renderCycle(){
  const pred=predicted();
  const ns=pred[0];
  const daysUntil=ns?Math.round((parse(ns)-parse(today()))/86400000):null;
  document.getElementById('cycle').innerHTML=`
    <div class="cycle-section">
      <div class="cycle-title">🌸 Zyklus</div>
      <div class="drow">
        <span class="dlabel">Ø Länge</span>
        <input type="number" value="${db.cycle.avgLength||28}" min="15" max="45" style="width:65px;font-size:12px;padding:4px 6px;border:1px solid #ddd;border-radius:7px"
          onchange="db.cycle.avgLength=parseInt(this.value);save();renderCycle()"> Tage
      </div>
      ${ns?`<div class="drow">
        <span class="dlabel">Nächste</span>
        <span style="font-size:12px">~${ns} ${daysUntil>0?`(in ${daysUntil} Tagen)`:daysUntil===0?'(heute)':'(war vor '+Math.abs(daysUntil)+' Tagen)'}</span>
      </div>`:''}
      <div style="font-size:11px;color:#bbb;margin-top:6px">Menstruation in der Wochenansicht auf 🌸-Zeile klicken. Mehrere Einträge verfeinern die Vorhersage.</div>
      ${db.cycle.entries&&db.cycle.entries.length?`
        <div style="margin-top:10px">
          <div style="font-size:10px;color:#ccc;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px">Einträge</div>
          ${db.cycle.entries.map((e,i)=>`
            <div style="font-size:11px;color:#888;display:flex;gap:8px;align-items:center;margin-bottom:3px">
              <span>${e.start}</span>
              <span>Dauer: <input type="number" value="${e.duration||5}" min="1" max="14" 
                style="width:45px;font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:5px"
                onchange="db.cycle.entries[${i}].duration=parseInt(this.value);save();renderCycle()"> Tage</span>
              <button class="del-btn" onclick="db.cycle.entries.splice(${i},1);save();renderCycle()">✕</button>
            </div>`).join('')}
        </div>`:''}
    </div>`;
}

function render(){
  renderStats();
  if(view==='week'){
    document.getElementById('btn-week').classList.add('active');
    document.getElementById('btn-month').classList.remove('active');
    renderWeek();
  } else {
    document.getElementById('btn-month').classList.add('active');
    document.getElementById('btn-week').classList.remove('active');
    renderMonth();
  }
  renderDetail();
  renderCycle();
}

render();
</script>
</body>
</html>
