name: CI

# Runs on every push and PR — including branches, so a red X shows up before
# anything reaches main. The deploy gate itself lives in package.json's
# "build" script (Vercel runs it), this workflow is the early warning.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
