<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Meta-Wochenplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfzeile, Projekt-Auslastung (Plan gegen Ist), Editor (eintragen, Block, neu), Wochenraster mit Ist-Stunden je Tag, editierbare Reihenfolge-Listen, Wochenverlauf */
:root{
  --bg:#F5F4F8; --surface:#FFFFFF; --surface-2:#ECEAF3; --ink:#1D1A2B; --ink-2:#5C5870; --line:#DAD7E5;
  --accent:#4B3A9E; --accent-ink:#FFFFFF;
  --ok:#1B7F51; --warn:#BE3A2B; --amber:#946408;
  --sol:#2F5BEA; --sol-bg:#E4EBFD; --sol-ink:#1B3C9C;
  --pl:#DB6322; --pl-bg:#FCE8DB; --pl-ink:#8A360C;
  --wren:#12998A; --wren-bg:#D8F1ED; --wren-ink:#0A5B51;
  --bloom:#C23C93; --bloom-bg:#F8E0EF; --bloom-ink:#86205F;
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14121C; --surface:#1D1A29; --surface-2:#27233A; --ink:#EEEDF5; --ink-2:#A8A5BB; --line:#363250;
    --accent:#9C8CFF; --accent-ink:#14121C;
    --ok:#6BD39A; --warn:#FF8A7A; --amber:#F0C060;
    --sol:#7C9CFF; --sol-bg:#1F2A52; --sol-ink:#C5D3FF;
    --pl:#FF9A61; --pl-bg:#4A2A17; --pl-ink:#FFD2B8;
    --wren:#4FD1BF; --wren-bg:#14403B; --wren-ink:#B5F0E7;
    --bloom:#F07FC6; --bloom-bg:#4A1D3B; --bloom-ink:#FFC9EA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14121C; --surface:#1D1A29; --surface-2:#27233A; --ink:#EEEDF5; --ink-2:#A8A5BB; --line:#363250;
  --accent:#9C8CFF; --accent-ink:#14121C;
  --ok:#6BD39A; --warn:#FF8A7A; --amber:#F0C060;
  --sol:#7C9CFF; --sol-bg:#1F2A52; --sol-ink:#C5D3FF;
  --pl:#FF9A61; --pl-bg:#4A2A17; --pl-ink:#FFD2B8;
  --wren:#4FD1BF; --wren-bg:#14403B; --wren-ink:#B5F0E7;
  --bloom:#F07FC6; --bloom-bg:#4A1D3B; --bloom-ink:#FFC9EA;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.page{max-width:1400px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-0.01em}
.num,.big,.h,.lim,td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.top h1{font-size:clamp(28px,4vw,40px);line-height:1.05;font-weight:700}
.lede{margin:6px 0 0;color:var(--ink-2)}
.sync{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tsel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.tsel select{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 8px;height:34px}
.btn{font:600 13px/1 var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 13px;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.sq{width:32px;height:32px;padding:0;font-size:16px}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.mini{width:22px;height:22px;padding:0;font-size:13px;border-radius:5px;line-height:1}
.btn:focus-visible,.blk:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ed:focus-visible,.dc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--accent);font-size:13.5px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pt{display:flex;align-items:center;gap:8px;min-width:0}
.pt b{font-family:var(--f-disp);font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.kind{margin-left:auto;font-size:11.5px;color:var(--ink-2);text-align:right}
.pn{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big{font-size:28px;font-weight:500;line-height:1}
.of{font-size:12.5px;color:var(--ink-2)}
.pbar{position:relative;height:16px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 13%,transparent);border-left:1px solid var(--ink-2);border-right:1px solid var(--ink-2)}
.pbar .plan{position:absolute;left:0;top:2px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--c) 38%,transparent)}
.pbar .fill{position:absolute;left:0;top:9px;height:5px;border-radius:3px;background:var(--c)}
.pm{font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2)}
.pm.warn{color:var(--warn);font-weight:600}
.pm.ok{color:var(--ok);font-weight:600}
.pm.low{color:var(--amber);font-weight:600}
.dch{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.dlab{font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-right:4px}
.dc{font:600 11px var(--f-body);width:26px;height:24px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;padding:0}
.dc[aria-pressed="true"]{background:var(--cbg);color:var(--ci);border-color:var(--c)}
.tgt{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bs{font:500 13px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;height:26px;padding:0 4px}
.tg{font:500 13px var(--f-mono);width:3.6em;height:26px;text-align:center;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 2px;-moz-appearance:textfield}
.tg::-webkit-outer-spin-button,.tg::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px 36px}
.erow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.erow{flex:0 1 auto}
.erow.hint{color:var(--ink-2);align-items:center;min-height:50px}
.elabel{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);align-self:center;min-width:104px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.f input,.f select{font:500 14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;height:34px;min-width:0}
.f input[id=ed-title]{width:min(240px,100%)}
.step{display:flex;align-items:center;gap:8px;height:34px}
.step .num{min-width:3.6em;text-align:center;font-weight:500;color:var(--ink)}
.note{font-size:12.5px;color:var(--ink-2);align-self:center}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dh{display:grid;grid-template-columns:minmax(0,1fr);gap:4px 8px;padding:10px 12px 12px;align-items:start}
.dn{display:flex;flex-direction:column;min-width:0}
.dn b{font-family:var(--f-disp);font-size:17px;line-height:1.2;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 6px}
.dn small{font:400 11px var(--f-mono);color:var(--ink-2)}
.nowb{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:3px 5px}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tag.warn,.num.warn{color:var(--warn)}
.dt{display:flex;align-items:center;gap:3px;font-size:13px}
.dt .num{font-weight:500}
.sl{color:var(--ink-2)}
.lim{width:3.3em;font-size:13px;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--ink-2);padding:0 0 1px;text-align:center;-moz-appearance:textfield}
.lim::-webkit-outer-spin-button,.lim::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.dbar{grid-column:1/-1;display:flex;gap:1px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.dbar i{display:block;height:100%}
.day-b{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface-2);min-height:140px;transition:background .15s}
.day-b.over{background:color-mix(in srgb,var(--accent) 20%,var(--surface-2))}
.empty{margin:auto;font-size:12.5px;color:var(--ink-2);text-align:center}
.log{padding:8px 10px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lh{display:flex;justify-content:space-between;align-items:baseline;font:600 10.5px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lh .num{font-size:12px;letter-spacing:0;color:var(--ink)}
.lchips{display:flex;flex-direction:column;gap:4px}
.lc{display:flex;align-items:center;gap:5px;border-radius:6px;padding:2px 3px 2px 8px;background:var(--cbg);color:var(--ci);font-size:12px}
.lc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lc .num{font-size:11.5px;white-space:nowrap}
.lc .btn{background:transparent;border-color:color-mix(in srgb,var(--c) 40%,transparent);color:var(--ci)}
.lnone{margin:0;font-size:12px;color:var(--ink-2)}

.blk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n h m" "s s s" "f f f";align-content:start;gap:2px 6px;min-height:var(--mh);padding:6px 9px 7px;border-radius:6px;background:var(--cbg);color:var(--ci);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none}
.blk .n{grid-area:n;font:600 12.5px/1.25 var(--f-body)}
.blk .h{grid-area:h;font-size:11.5px;white-space:nowrap}
.blk .sub{grid-area:s;font-size:12px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.blk .sub:empty{display:none}
.blk .bm{grid-area:m;width:20px;height:20px;font-size:14px;background:transparent;border-color:transparent;color:var(--ci)}
@media (hover:hover){.blk .bm{opacity:0}.blk:hover .bm,.blk:focus-within .bm{opacity:1}}
.bf{grid-area:f;display:flex;align-items:center;gap:4px;margin-top:2px;min-width:0}
.bf .btn.mini{flex:none;background:transparent;border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--ci)}
.bf .btn.mini:hover:not(:disabled){background:color-mix(in srgb,var(--c) 22%,transparent)}
.bp{--r:2px;flex:1;min-width:0;display:flex;gap:2px;align-items:center;height:22px;cursor:pointer}
.bp i{flex:1;height:9px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 26%,transparent)}
.bp i.on{background:var(--c)}
.bp.solid{gap:0}
.bp.solid i{border-radius:0}
.bp.solid i:first-child{border-radius:var(--r) 0 0 var(--r)}
.bp.solid i:last-child{border-radius:0 var(--r) var(--r) 0}
.bp.big{--r:4px;height:30px}
.bp.big i{height:18px}
.blk.fixed{cursor:default;background:repeating-linear-gradient(135deg,var(--cbg) 0 7px,color-mix(in srgb,var(--c) 18%,var(--cbg)) 7px 14px)}
.blk.done{opacity:.6}
.blk.done .n{text-decoration:line-through;text-decoration-thickness:1px}
.blk.missed{border-style:dashed;border-color:var(--warn)}
.blk.off{box-shadow:inset 0 0 0 1px var(--amber)}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.blk.drag{opacity:.4}

.road,.hist{margin-top:44px}
.road h2,.hist h2{font-size:24px;font-weight:700}
.sec-sub{margin:4px 0 16px;color:var(--ink-2)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.rc h3{display:flex;align-items:center;gap:8px;font-size:18px}
.rc h3 .cnt{margin-left:auto;font:400 12px var(--f-mono);color:var(--ink-2)}
.why{margin:8px 0 10px;font-size:13.5px;color:var(--ink-2);border-radius:4px;padding:1px 2px;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:var(--ink-2);opacity:.7}
.ed:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.items{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:2px}
.it{position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:start;gap:0 8px;padding:4px 0}
.it .ck{margin:3px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.it .no{font-size:12px;color:var(--ink-2);padding-top:2px;min-width:1.2em;text-align:right}
.it-t{font-size:14px;line-height:1.45;min-height:1.45em;padding:0 2px;border-radius:4px;overflow-wrap:anywhere}
.it.done .it-t{color:var(--ink-2);text-decoration:line-through}
.it.now .it-t{font-weight:600}
.nowtag{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px;white-space:nowrap}
.it-b{display:none;position:absolute;right:0;top:2px;gap:2px;padding-left:6px;background:var(--surface);box-shadow:-10px 0 8px var(--surface)}
.it:focus-within .it-b{display:flex}
@media (hover:hover){.it:hover .it-b{display:flex}}
.foot{margin-top:24px;font-size:12.5px;color:var(--ink-2);max-width:72ch}

.hh{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tw table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
.tw th,.tw td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tw th{font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tw th .dot{display:inline-block;margin-right:6px}
.tw tr:last-child td{border-bottom:0}
.run{font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px}
.cp{width:100%;min-height:120px;margin-top:10px;font:13px/1.5 var(--f-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}

.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:10px;margin-bottom:18px;max-width:100%;flex-wrap:wrap}
.tabs button{font:600 13px/1 var(--f-body);padding:9px 14px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 20%,transparent)}
.tabs button:focus-visible,.wc:focus-visible,.wt:focus-visible,.wd summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.wc{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.wc:hover{background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.wc[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.wc .r{display:flex;align-items:center;gap:8px;min-width:0}
.wc .r b{font:700 16px var(--f-disp)}
.wc .kind{margin-left:auto;font-size:11.5px;color:var(--ink-2)}
.wc .open{display:flex;align-items:baseline;gap:6px}
.wc .open b{font:500 24px/1 var(--f-mono);letter-spacing:-.04em;word-spacing:-.15em}
.wc .open span{font-size:12.5px;color:var(--ink-2)}
.wc .lbar{display:flex;gap:2px;height:8px}
.wc .lbar i{display:block;height:100%;border-radius:3px;background:var(--c);min-width:4px}
.wc .leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-2)}
.wc .leg b{font:500 12px var(--f-mono);color:var(--ink)}
.wc .leg .dim{opacity:.75}
.wc .pbar{display:block}
.wc .cap{font-size:12px;color:var(--ink-2)}
.wc .cap.warn b{color:var(--amber)}
.wc .cap b{font:500 12px var(--f-mono);color:var(--ink)}
.wc .days{display:flex;gap:6px;font:500 11px var(--f-mono);color:var(--ink-2);opacity:.55}
.wc .days .on{opacity:1;color:var(--ci);font-weight:600}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.wk-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:10px}
.wk-h h2{font-size:15px}
.wk-leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--ink-2)}
.wk-leg span{display:inline-flex;align-items:center;gap:5px}
.wk-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-d{display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-bar{position:relative;height:72px;display:flex;flex-direction:column-reverse;gap:1px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.wk-bar i{display:block;position:relative;background:color-mix(in srgb,var(--c) 30%,var(--surface-2))}
.wk-bar u{position:absolute;left:0;right:0;bottom:0;background:var(--c);text-decoration:none}
.wk-bar .wlim{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--ink);z-index:2;pointer-events:none}
.wk-bar.over{box-shadow:0 0 0 2px var(--warn)}
.wk-d.today .wk-bar{box-shadow:0 0 0 2px var(--accent)}
.wk-d.today .wk-bar.over{box-shadow:0 0 0 2px var(--warn)}
.wk-l b.ov{color:var(--warn)}
.wk-l{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--ink-2)}
.wk-l b{font:500 11.5px var(--f-mono);color:var(--ink)}
.wk-d.today .wk-l span{color:var(--accent);font-weight:600}
.wp{background:var(--surface);border:1px solid var(--c);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.wp-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.wp-h h2{font-size:20px;display:flex;align-items:center;gap:8px}
.wp-h .sp{margin-left:auto}
.wadd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

  function fresh(){

  /* ---------- Laden, Speichern ---------- */
  function okBlock(b){return b&&P[b.project]&&b.day>=0&&b.day<=6&&typeof b.hours==='number'}

  function loadLocal(){

  }
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  var ui={tab:'plan',wquick:'',wopen:null,wdone:false,wnotes:false,wlog:false,wcell:{},wset:{},big:null,wtoast:'',wproj:'sol',wlane:'up',sel:null,addProj:'sol',addDay:0,addH:1,logProj:'sol',logDay:null,logH:1,confirm:false,toast:'',todayMode:'auto',sync:'local',copyText:''};
  var state=loadLocal()||fresh();

  function sumP(k){return state.blocks.filter(function(b){return b.project===k}).reduce(function(a,b){return a+b.hours},0)}
  function sumD(d){return state.blocks.filter(function(b){return b.day===d}).reduce(function(a,b){return a+b.hours},0)}
  function loggedD(d){return state.logs.filter(function(l){return l.day===d}).reduce(function(a,l){return a+l.hours},0)}
  function dayDate(d){var x=parseISO(state.weekStart);x.setDate(x.getDate()+d);return x}

  function archiveWeek(){

  function todayIdx(){

  /* ---------- Cloud-Speicher (db, privat pro Person) ---------- */
  var cloud={ref:null,timer:null,busy:false,dirty:false};
  function scheduleCloud(){

  }
  function flushCloud(){
    if(!cloud.ref||cloud.busy||!cloud.dirty)return;
    cloud.busy=true;cloud.dirty=false;
    var body={json:JSON.stringify(state),ts:state.ts};
    cloud.ref.set(body).then(function(){
      cloud.busy=false;

  function initCloud(){
    try{
      if(!window.claude||!window.claude.use)return;
      Promise.all([window.claude.use('user'),window.claude.use('db')]).then(function(r){
        var user=r[0],db=r[1];
        if(!user||!db)return null;
        return user.id().then(function(id){
          if(!id)return null;
          var ref=db.doc('data/users/'+id+'/planner');
          return ref.get().then(function(snap){
            var pushLocal=true;
            if(snap.exists){
              var d=snap.data()||{};
              if((+d.ts||0)>state.ts){
                try{
                  var s=normalize(JSON.parse(d.json));
                  if(s){state=s;rollWeek();saveLocal();pushLocal=false;renderAll()}
                }catch(e){}
              }
            }
            cloud.ref=ref;ui.sync='cloud';
            if(pushLocal||state.ts>(snap.exists?(+snap.data().ts||0):0)){cloud.dirty=true;flushCloud()}

    }catch(e){}
  }
  function persist(){state.ts=Date.now();saveLocal();scheduleCloud()}

  /* ---------- Auswertung: Plan gegen Ist ---------- */
  function compute(){
    var today=todayIdx(),cov={},byP={};
    ORDER.forEach(function(k){
      var bl=state.blocks.map(function(b,i){return {b:b,i:i}}).filter(function(x){return x.b.project===k})
        .sort(function(a,c){return a.b.day-c.b.day||a.i-c.i}).map(function(x){return x.b});
      var rem=[0,0,0,0,0,0,0],ist=0,soll=0,ids={};
      bl.forEach(function(b){ids[b.id]=b;cov[b.id]=0});
      state.logs.forEach(function(l){
        if(l.project!==k)return;
        ist+=l.hours;
        var left=l.hours,tb=l.block&&ids[l.block];
        if(tb){var t=Math.min(left,tb.hours-cov[tb.id]);cov[tb.id]+=t;left-=t}
        rem[l.day]+=left;
      });
      bl.forEach(function(b){var t=Math.min(b.hours-cov[b.id],rem[b.day]);cov[b.id]+=t;rem[b.day]-=t;soll+=b.hours});
      var pool=rem.reduce(function(a,x){return a+x},0);
      var mode=(state.settings&&state.settings[k]&&state.settings[k].reduce)||'next';
      function drain(b){
        var need=b.hours-cov[b.id];
        if(need>1e-9&&pool>1e-9){var c=Math.min(need,pool);cov[b.id]+=c;pool-=c}
      }
      if(mode==='last'){
        for(var q=bl.length-1;q>=0;q--)drain(bl[q]);
      }else{
        if(mode==='even'){
          var fut=bl.filter(function(b){return (today<0||b.day>=today)&&b.hours-cov[b.id]>1e-9});
          var tot=fut.reduce(function(a,b){return a+b.hours-cov[b.id]},0),take=Math.min(pool,tot);
          if(take>1e-9){
            var rest=take;
            fut.forEach(function(b,n){
              var need=b.hours-cov[b.id];
              var share=n===fut.length-1?rest:Math.round(take*need/tot*2)/2;
              var c=Math.max(0,Math.min(need,rest,share));
              cov[b.id]+=c;rest-=c;pool-=c;
            });
          }
        }
        bl.forEach(drain);
      }
      var missed=0,open=0;
      bl.forEach(function(b){
        var left=b.hours-cov[b.id];
        if(left<=1e-9)return;
        if(b.day<today){if(!b.fixed)missed+=left}else open+=left;
      });
      byP[k]={soll:soll,ist:ist,missed:missed,open:open,over:pool};
    });
    return {cov:cov,byP:byP,today:today};
  }

  function place(b,day,refId,after){
    state.blocks=state.blocks.filter(function(x){return x!==b});
    b.day=day;
    var idx=-1;
    if(refId){
      var i=-1;state.blocks.forEach(function(x,n){if(x.id===refId)i=n});
      if(i>-1)idx=after?i+1:i;
    }
    if(idx<0){
      var last=-1;state.blocks.forEach(function(x,n){if(x.day===day)last=n});
      idx=last>=0?last+1:state.blocks.length;
    }
    state.blocks.splice(idx,0,b);
  }
  function selected(){return state.blocks.filter(function(b){return b.id===ui.sel})[0]||null}

  function blockById(id){
    for(var i=0;i<state.blocks.length;i++){if(state.blocks[i].id===id)return state.blocks[i]}
    return null;
  }
  function addLog(day,proj,h,block){
    var l=state.logs.filter(function(x){return x.day===day&&x.project===proj&&(x.block||null)===(block||null)})[0];
    if(l)l.hours=Math.min(16,l.hours+h);
    else{var n={id:uid('l'),day:day,project:proj,hours:h};if(block)n.block=block;state.logs.push(n)}
  }
  function takeHours(list,amount){
    for(var i=0;i<list.length&&amount>1e-9;i++){var t=Math.min(list[i].hours,amount);list[i].hours-=t;amount-=t}
    state.logs=state.logs.filter(function(l){return l.hours>1e-9});
    return amount;
  }
  function isOwn(l){return !!(l.block&&blockById(l.block))}
  function removeHours(b,amount){
    var k=b.project;

    if(amount>1e-9)amount=takeHours(state.logs.filter(function(l){return l.project===k&&!isOwn(l)&&l.day===b.day}),amount);
    if(amount>1e-9)amount=takeHours(state.logs.filter(function(l){return l.project===k&&!isOwn(l)}).sort(function(x,y){return y.day-x.day}),amount);
  }
  function adjustDay(d,k,delta){

    var ls=state.logs.filter(function(l){return l.day===d&&l.project===k});

  }
  function setProgress(b,target){

    var delta=target-cur;

    else if(delta<-1e-9)removeHours(b,-delta);
  }

  /* Woche automatisch füllen: Ziel = Mitte des Richtwerts, Blöcke in der Blockgröße des Projekts,
     nur auf vorgesehene Tage und innerhalb der Tageslimits. Feste Termine, vergangene Tage und
     Blöcke mit Fortschritt bleiben unberührt. */
  function autoFill(){
    var c0=compute(),first=c0.today>=0?c0.today:0;
    state.blocks=state.blocks.filter(function(b){
      if(b.fixed||b.day<first)return true;
      return (c0.cov[b.id]||0)>1e-9;
    });
    var added={},unplaced={};
    ORDER.forEach(function(k){
      var t=state.targets[k],target=Math.round((t.lo+t.hi)/2*2)/2;
      var need=Math.round((target-sumP(k))*2)/2;
      added[k]=0;unplaced[k]=0;
      if(need<0.5)return;
      var size=state.blockSize[k]||2;
      var n=Math.floor(need/size+1e-9),r=Math.round((need-n*size)*2)/2,chunks=[],i;
      for(i=0;i<n;i++)chunks.push(size);
      if(r>=1)chunks.push(r);
      else if(r>0){if(chunks.length)chunks[chunks.length-1]+=r;else chunks.push(r)}
      var days=(state.days[k]||[]).filter(function(d){return d>=first});
      var sibling=k==='wren'?'bloom':(k==='bloom'?'wren':null);
      chunks.forEach(function(ch){
        var rem=ch,guard=0;
        while(rem>1e-9&&guard++<24){
          var best=-1,bs=-1e9,bf=0;
          days.forEach(function(d){
            var free=state.limits[d]-sumD(d);
            if(free<0.5-1e-9)return;
            var side=(k==='wren'||k==='bloom');
            var fit=Math.min(rem,Math.floor(free*2)/2,(side&&d<5)?1:99);
            var has=state.blocks.some(function(b){return b.day===d&&b.project===k});
            var sib=sibling&&state.blocks.some(function(b){return b.day===d&&b.project===sibling});
            var score=(fit>=rem-1e-9?0:-60)+free+(side&&d>=5?3:0)-(has?100:0)-(sib?40:0);
            if(score>bs){bs=score;best=d;bf=fit}
          });
          if(best<0)break;
          place(mk(best,k,bf,''),best,null,false);
          added[k]+=bf;rem-=bf;
        }
        if(rem>1e-9)unplaced[k]+=rem;
      });
    });
    var parts=ORDER.filter(function(k){return added[k]>0}).map(function(k){return P[k].name+' +'+fmt(added[k])+' h'});
    var miss=ORDER.filter(function(k){return unplaced[k]>1e-9}).map(function(k){return P[k].name+' '+fmt(unplaced[k])+' h'});
    return (parts.length?'Woche gefüllt (Ziel = Mitte des Richtwerts): '+parts.join(', ')+'.':'Der Plan liegt schon im Richtwert, es wurde nichts ergänzt.')+
      (miss.length?' Nicht untergebracht: '+miss.join(', ')+' (Tage oder Tageslimits voll).':'');
  }

  /* Verpasste Stunden eines Projekts aus vergangenen Tagen auf kommende Tage verteilen */
  function redistribute(k){
    var c=compute(),info=c.byP[k],today=c.today;
    if(!info||info.missed<=1e-9||today<0)return '';
    var missed=info.missed;
    state.blocks=state.blocks.filter(function(b){
      if(b.project!==k||b.day>=today||b.fixed)return true;
      var cv=c.cov[b.id];
      if(cv>=b.hours-1e-9)return true;
      if(cv<=1e-9)return false;
      b.hours=cv;return true;
    });
    var c2=compute();
    function load(d){
      var l=0;
      state.blocks.forEach(function(b){if(b.day===d)l+=Math.max(0,b.hours-(c2.cov[b.id]||0))});
      if(d===today)l+=loggedD(d);
      return l;
    }
    var allowed=(state.days[k]||[]).filter(function(d){return d>=today});
    if(!allowed.length)allowed=[0,1,2,3,4,5,6].filter(function(d){return d>=today});
    if(!allowed.length)allowed=[today];
    var left=missed,added={},guard=0;
    function addTo(d,h){
      var ex=state.blocks.filter(function(b){return b.project===k&&b.day===d&&!b.fixed&&b.title==='Nachgeholt'})[0];
      if(ex)ex.hours=ex.hours+h;else place(mk(d,k,h,'Nachgeholt'),d,null,false);
      added[d]=(added[d]||0)+h;

      allowed.forEach(function(d){var f=state.limits[d]-load(d);if(f>bf+1e-9){bf=f;best=d}});
      var chunk=Math.min(left,2);
      if(bf>=0.5)chunk=Math.min(chunk,Math.floor(bf*2)/2);else chunk=left;
      addTo(best,chunk);left-=chunk;
    }
    var parts=Object.keys(added).map(Number).sort(function(a,b){return a-b}).map(function(d){return DAYS[d].s+' +'+fmt(added[d])+' h'});
    var over=allowed.some(function(d){return load(d)>state.limits[d]+1e-9});
    return fmt(missed)+' h '+P[k].name+' neu verteilt: '+parts.join(', ')+'.'+(over?' Mindestens ein Tag liegt jetzt über dem Limit.':'');
  }

  function dayHead(d,c){

  function logArea(d,c){
    var ls=[];ORDER.forEach(function(k){var hh=state.logs.filter(function(l){return l.day===d&&l.project===k}).reduce(function(a,l){return a+l.hours},0);if(hh>1e-9)ls.push({project:k,hours:hh})});
    if(d>c.today&&!ls.length)return '';
    var tot=ls.reduce(function(a,l){return a+l.hours},0);
    var chips=ls.map(function(l){
      var p=P[l.project];

  function itemText(el){

  listsEl.addEventListener('click',function(e){
    var b=e.target.closest('[data-lact]');
    if(!b)return;
    var card=b.closest('.rc'),k=card.dataset.k,L=state.lists[k],row=b.closest('.it'),act=b.dataset.lact;
    var ix=row?L.items.map(function(i){return i.id}).indexOf(row.dataset.i):-1;
    if(act==='add'){var n=itm('');L.items.push(n);persist();renderLists(n.id);return}
    if(ix<0)return;
    if(act==='up'&&ix>0){var t=L.items[ix];L.items[ix]=L.items[ix-1];L.items[ix-1]=t}
    else if(act==='down'&&ix<L.items.length-1){var t2=L.items[ix];L.items[ix]=L.items[ix+1];L.items[ix+1]=t2}
    else if(act==='del'){L.items.splice(ix,1)}
    persist();renderLists();
  });
  listsEl.addEventListener('change',function(e){
    var t=e.target;
    if(!t.classList.contains('ck'))return;
    var card=t.closest('.rc'),row=t.closest('.it'),L=state.lists[card.dataset.k];
    L.items.forEach(function(i){if(i.id===row.dataset.i)i.done=t.checked});

  listsEl.addEventListener('focusout',function(e){
    var ed=e.target.closest&&e.target.closest('.ed');
    if(!ed)return;

    var L=state.lists[card.dataset.k],row=ed.closest('.it'),changed=false;

  listsEl.addEventListener('keydown',function(e){
    var ed=e.target.closest&&e.target.closest('.it-t');
    if(!ed)return;

    var ix=L.items.map(function(i){return i.id}).indexOf(row.dataset.i);

    if(e.key==='Enter'){
      e.preventDefault();
      L.items[ix].text=itemText(ed);
      var n=itm('');L.items.splice(ix+1,0,n);persist();renderLists(n.id);

  /* ---------- Darstellung: Wochenverlauf ---------- */
  function range(ws){var a=parseISO(ws),b=parseISO(ws);b.setDate(b.getDate()+6);return dm(a)+'–'+dm(b)}
  function weekRows(c){
    var cur={ws:state.weekStart,kw:isoWeek(parseISO(state.weekStart)),soll:{},ist:{},running:true};
    ORDER.forEach(function(k){cur.soll[k]=c.byP[k].soll;cur.ist[k]=c.byP[k].ist});
    return [cur].concat(state.history);
  }
  function historyText(rows){
    return rows.map(function(r){
      return 'KW '+r.kw+' ('+range(r.ws)+')'+(r.running?' laufend':'')+': '+ORDER.map(function(k){return P[k].name+' '+fmt(r.ist[k]||0)+' h'}).join(' · ');
    }).join('\n');
  }
  function renderHistory(){
    var c=compute(),rows=weekRows(c);
    var head='<th>Woche</th><th>Zeitraum</th>'+ORDER.map(function(k){return '<th><span class="dot" style="background:var(--'+k+')"></span>'+P[k].name+'</th>'}).join('')+'<th>Gesamt</th>';
    var body=rows.map(function(r){
      var si=0,ss=0;
      var cells=ORDER.map(function(k){var a=r.ist[k]||0,s=r.soll[k]||0;si+=a;ss+=s;return '<td class="num">'+fmt(a)+' / '+fmt(s)+'</td>'}).join('');
      return '<tr><td>KW '+r.kw+(r.running?'<span class="run">läuft</span>':'')+'</td><td class="num">'+range(r.ws)+'</td>'+cells+'<td class="num">'+fmt(si)+' / '+fmt(ss)+'</td></tr>';
    }).join('');
    histEl.innerHTML='<div class="hh"><h2 id="hist-h">Wochenverlauf</h2><button class="btn" data-act="copy">Als Text kopieren</button></div>'+
      '<p class="sec-sub">Gearbeitete Stunden gegen Plan (Ist / Plan). Jede abgelaufene Woche landet hier automatisch, praktisch für den Stundennachweis.</p>'+
      '<div class="tw"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
      (ui.copyText?'<textarea class="cp" id="cp" readonly aria-label="Verlauf als Text">'+esc(ui.copyText)+'</textarea>':'');
    if(ui.copyText){var t=histEl.querySelector('#cp');if(t){t.focus();t.select()}}

  });

  function renderAll(){render();renderLists();renderHistory();renderWren()}
  function commit(){persist();render();renderHistory()}

  /* ---------- Aktionen und Ereignisse (Raster) ---------- */
  function act(k,el){
    var b=(el&&el.dataset&&el.dataset.id&&blockById(el.dataset.id))||selected(),c;
    if(k==='dm'&&b)b.hours=Math.max(0.5,b.hours-0.5);
    else if(k==='dp'&&b)b.hours=Math.min(8,b.hours+0.5);
    else if(k==='del'&&b&&!b.fixed){state.blocks=state.blocks.filter(function(x){return x!==b});ui.sel=null}
    else if(k==='add'){var nb=mk(ui.addDay,ui.addProj,ui.addH,'');place(nb,ui.addDay,null,false);ui.sel=nb.id}
    else if(k==='swap'){state.blocks.forEach(function(x){if(x.project==='wren')x.project='bloom';else if(x.project==='bloom')x.project='wren'})}
    else if(k==='tpl'){state.template=clone(state.blocks);ui.toast='Standardwoche gespeichert. Ab der nächsten Woche startet der Plan damit.'}
    else if(k==='hide'){state.hideDone=!state.hideDone}
    else if(k==='log'){addLog(logDay(),ui.logProj,ui.logH)}
    else if(k==='lm'||k==='lp'){adjustDay(+el.dataset.d,el.dataset.k,k==='lm'?-0.5:0.5)}
    else if(k==='bp'&&b){setProgress(b,(compute().cov[b.id]||0)+parseFloat(el.dataset.d))}
    else if(k==='bfull'&&b){setProgress(b,b.hours)}
    else if(k==='breset'&&b){setProgress(b,0)}
    else if(k==='edit'&&b){ui.sel=b.id;render();return}
    else if(k==='close'){flushTitle();ui.sel=null;render();return}
    else if(k==='menu'&&b){var mr=el.getBoundingClientRect();openCtx(b.id,mr.left,mr.bottom+4);return}
    else if(k==='redis'){ui.toast=redistribute(el.dataset.k)||''}
    else if(k==='tday'){
      var arr=state.days[el.dataset.k],d=+el.dataset.d,ix=arr.indexOf(d);
      if(ix>=0){if(arr.length>1)arr.splice(ix,1)}else{arr.push(d);arr.sort(function(x,y){return x-y})}
    }
    else if(k==='reset'){
      if(!ui.confirm){ui.confirm=true;setTimeout(function(){if(ui.confirm){ui.confirm=false;render()}},4000);render();return}
      state.blocks=clone(state.template);ui.sel=null;ui.confirm=false;ui.toast='Plan auf die Standardwoche zurückgesetzt. Eingetragene Stunden bleiben.';
    }
    else if(k==='fill'){
      if(!ui.confirmFill){ui.confirmFill=true;setTimeout(function(){if(ui.confirmFill){ui.confirmFill=false;render()}},5000);render();return}
      ui.confirmFill=false;ui.sel=null;ui.toast=autoFill();
    }
    else if(k==='copy')return;
    commit();
  }

  function blockInfo(k,c){
    var cfg=state.settings[k];
    var bl=(c.today<0||!cfg.fromPlan)?[]:state.blocks.filter(function(b){return b.project===k&&b.day===c.today&&!b.fixed});
    var cap=Math.round(bl.reduce(function(a,b){return a+b.hours},0)*60);
    var all=tasksOf(k,'today'),done=all.filter(function(t){return t.done}),open=all.filter(function(t){return !t.done});
    var doneMin=sumMin(done),free=Math.max(0,cap-doneMin),used=0,inB=[],outB=[];
    var limited=cap>0||cfg.onlyBlock;
    open.forEach(function(t){
      if(!limited||used+t.min<=free+1e-9){inB.push(t);used+=t.min}else outB.push(t);
    });
    var label=bl.length===1?('Block'+(bl[0].time?' '+bl[0].time+' Uhr':'')+' · '+hm(cap)):(bl.length+' Blöcke · '+hm(cap));

    var free=bi.free-bi.used,moved=[],srcs=['up'].concat(cfg.fillWeek?['week']:[]);
    srcs.forEach(function(l){
      tasksOf(k,l).forEach(function(t){
        if(!t.done&&t.min<=free+1e-9){free-=t.min;moved.push(t)}

    });
    if(!moved.length)return P[k].name+': nichts aus '+(cfg.fillWeek?'Next Up oder Nächste Woche':'Next Up')+' passt noch in den Block.';
    state.mock.tasks=state.mock.tasks.filter(function(t){return moved.indexOf(t)<0});
    moved.forEach(function(t){t.lane='today';state.mock.tasks.push(t)});
    return P[k].name+': '+moved.length+(moved.length===1?' Aufgabe':' Aufgaben')+' nach Heute gezogen, '+(free>=5?hm(free)+' bleiben frei.':'der Block ist voll.');

  /* Schnell erfassen: eine Aufgabe pro Zeile. Vorne darf ein Marker stehen (🟦 - * • 1.), 🟥 oder ! setzt Priorität,
     hinten optional Minuten (30m, 45 min, 1,5h). Ohne Angabe: 20 m. */
  function parseQuick(txt,k){
    var out=[],mark=/^(?:[-*•▪◦·]|\[[ xX]?\]|\d+[.)]|[\u{1F7E5}-\u{1F7EB}\u2B1B\u2B1C]\uFE0F?)\s*/u;
    txt.split(/\r?\n/).forEach(function(line){
      var l=line.trim(),prio=false,m;
      if(!l)return;
      while((m=l.match(mark))){if(m[0].indexOf('\u{1F7E5}')===0)prio=true;l=l.slice(m[0].length)}
      if(l.charAt(0)==='!'){prio=true;l=l.slice(1).trim()}
      var min=20,mm=l.match(/[\s(]+(\d+(?:[.,]\d+)?)\s*(h|std|min|m)\.?\)?$/i);
      if(mm){
        var v=parseFloat(mm[1].replace(',','.'));
        min=/^h|std/i.test(mm[2])?v*60:v;
        min=Math.max(5,Math.min(480,Math.round(min/5)*5));
        l=l.slice(0,mm.index).trim();
      }
      l=l.slice(0,80).trim();
      if(l)out.push({id:uid('t'),project:k,lane:'inbox',text:l,min:min,done:false,prio:prio});
    });
    return out;
  }

  }

    }).join('');

    var logs=DAYS.map(function(D,d){
      var h=state.logs.filter(function(l){return l.day===d&&l.project===k}).reduce(function(a,l){return a+l.hours},0);
      return h>1e-9?'<span class="chip"><b>'+D.s+'</b><i class="num">'+fmt(h)+' h</i></span>':'';
    }).join('');
    return '<div class="mback"><button class="btn" data-w="back">◂ Zurück zur Matrix</button><button class="btn" data-w="cfg" data-k="'+k+'" aria-expanded="'+!!ui.wset[k]+'">⚙ Einstellungen</button></div>'+
      (ui.wset[k]?'<div class="mx" style="display:block;margin-bottom:12px">'+cfgHTML(k)+'</div>':'')+
      '<section class="wp" style="--c:var(--'+k+');--cbg:var(--'+k+'-bg);--ci:var(--'+k+'-ink)">'+
      '<div class="wp-h"><h2><span class="dot" style="background:var(--c)"></span>'+p.name+'</h2><span class="of">'+hm(laneSums(k).today+laneSums(k).up+laneSums(k).week)+' offen</span>'+
      '<div class="sp"><button class="btn sm" data-w="wdone" aria-pressed="'+!!ui.wdone+'">'+(ui.wdone?'Erledigte ausblenden':'Erledigte zeigen ('+doneN+')')+'</button></div></div>'+
      inboxHTML(k)+
      '<div class="lanes">'+lanes+'</div>'+
      '<div class="quick"><label for="w-quick">Schnell erfassen</label>'+
        '<textarea id="w-quick" aria-describedby="w-quick-h" placeholder="🟦 Split-Screen für Schritt 5 30m&#10;🟥 Rechte beim Speichern prüfen 45m&#10;- Farbe angleichen">'+esc(ui.wquick)+'</textarea>'+
        '<div class="row2"><button class="btn primary" data-w="quick" data-k="'+k+'">In Aufgaben umwandeln</button><span class="hint" id="w-quick-h">Eine Aufgabe pro Zeile. Marker vorne werden entfernt, 🟥 oder ! setzt Priorität, Minuten hinten (30m, 1h) sonst 20 m. Strg+Enter geht auch.</span></div></div>'+
      '<details class="wd" data-d="notes"'+(ui.wnotes?' open':'')+'><summary>Notizen <span class="pv">'+esc(note.split('\n')[0]||'leer')+'</span></summary>'+
        '<textarea id="w-notes" data-k="'+k+'" aria-label="Notizen '+p.name+'">'+esc(note)+'</textarea></details>'+
      '<details class="wd" data-d="log"'+(ui.wlog?' open':'')+'><summary>Zeit diese Woche <span class="pv">'+fmt(c.byP[k].ist)+' h aus dem Wochenplan</span></summary>'+
        '<div class="wlog">'+(logs||'<span class="of">noch nichts eingetragen</span>')+'</div></details>'+
    '</section>';
  }
  function addBar(){
    var po=ORDER.map(function(k){return [k,P[k].name]});
    var laneO=LANES.map(function(l){return [l.id,l.n]});
    return '<div class="wadd" style="margin-bottom:12px"><select id="wa-proj" aria-label="Projekt">'+opts(po,ui.big||ui.wproj)+'</select><select id="wa-lane" aria-label="Status">'+opts(laneO,ui.wlane)+'</select>'+
      '<input id="wa-text" type="text" maxlength="80" placeholder="Neue Aufgabe …" aria-label="Neue Aufgabe">'+
      '<input id="wa-min" type="number" min="5" step="5" value="20" aria-label="Minuten"><button class="btn primary" data-w="wadd">Hinzufügen</button></div>';
  }
  function renderWren(){
    if(ui.tab!=='wren')return;
    var c=compute(),big=ui.big;
    wrenEl.innerHTML=
      '<header class="top"><div><h1>Projects</h1><p class="lede">Entwurf: Projekte, Aufgaben und Timeblocks in einer Ansicht. Die Aufgaben sind Beispiele, Plan, Blöcke und Stunden kommen live aus dem Wochenplan.</p></div>'+
      '<div class="acts"><button class="btn" data-w="plan">Wochenplan öffnen</button><button class="btn" data-w="reset">Beispielaufgaben zurücksetzen</button></div></header>'+
      (ui.wtoast?'<p class="mtoast" role="status">'+esc(ui.wtoast)+'</p>':'')+
      wWeek(c)+addBar()+
      (big?wBig(big,c):'<div class="mx">'+mHead(c)+ORDER.map(function(k){return mRow(k,c)}).join('')+'</div>');
  }
  function wAct(a,el){
    var m=state.mock,t;
    if(a==='plan'){applyTab('plan');return}
    if(a==='reset'){state.mock=defMock();ui.wopen=null;toastW('');persist();renderWren();return}
    if(a==='wdone'){ui.wdone=!ui.wdone;renderWren();return}
    if(a==='col'){m.collapsed[el.dataset.k]=!m.collapsed[el.dataset.k];if(!m.collapsed[el.dataset.k])delete m.collapsed[el.dataset.k];persist();renderWren();return}
    if(a==='big'){ui.big=el.dataset.k;ui.wopen=null;renderWren();window.scrollTo(0,0);return}
    if(a==='back'){ui.big=null;ui.wopen=null;renderWren();return}
    if(a==='cfg'){ui.wset[el.dataset.k]=!ui.wset[el.dataset.k];renderWren();return}
    if(a==='cell'){var key=el.dataset.k+'|'+el.dataset.l;ui.wcell[key]=!ui.wcell[key];renderWren();return}
    if(a==='fill'){toastW(fillBlock(el.dataset.k));persist();renderWren();return}
    if(a==='quick'){
      var ta=document.getElementById('w-quick'),k2=el.dataset.k,items=parseQuick(ta?ta.value:'',k2);
      if(!items.length){toastW('Nichts zum Umwandeln. Schreibe eine Aufgabe pro Zeile.');renderWren();return}
      items.forEach(function(it){m.tasks.push(it)});
      ui.wquick='';toastW(items.length+(items.length===1?' Aufgabe':' Aufgaben')+' im Eingang. Verteile sie auf die vier Status.');
      persist();renderWren();return;
    }
    if(a==='inall'){
      var ms=tasksOf(el.dataset.k,'inbox');ms.forEach(function(x){x.lane='up'});
      state.mock.tasks=state.mock.tasks.filter(function(x){return ms.indexOf(x)<0}).concat(ms);
      toastW(ms.length+' nach Next Up verschoben.');persist();renderWren();return;
    }
    if(a==='inclr'){
      var pk=el.dataset.k;state.mock.tasks=state.mock.tasks.filter(function(x){return !(x.project===pk&&x.lane==='inbox')});
      toastW('Eingang geleert.');persist();renderWren();return;
    }
    if(a==='wto'){
      var tt=mockTask(el.dataset.t);
      if(tt){m.tasks=m.tasks.filter(function(x){return x!==tt});tt.lane=el.dataset.l;m.tasks.push(tt);toastW('');persist();renderWren()}
      return;
    }
    if(a==='wday'){
      var k=el.dataset.k,d=+el.dataset.d,arr=(state.days[k]||[]).slice(),ix=arr.indexOf(d);
      if(ix>=0){if(arr.length>1)arr.splice(ix,1)}else{arr.push(d);arr.sort()}
      state.days[k]=arr;persist();renderWren();return;
    }
    if(a==='wadd'){
      var tx=document.getElementById('wa-text'),text=tx.value.trim();
      if(!text){tx.focus();return}
      var lane=document.getElementById('wa-lane').value,proj=document.getElementById('wa-proj').value;
      var min=Math.max(5,Math.round((parseFloat(document.getElementById('wa-min').value)||20)/5)*5);
      m.tasks.push({id:uid('t'),project:proj,lane:lane,text:text,min:min,done:false,prio:false});
      ui.wlane=lane;ui.wproj=proj;toastW('');persist();renderWren();
      var nt=document.getElementById('wa-text');
      if(nt)nt.focus();
      return;
    }
    t=mockTask(el.dataset.t);
    if(!t)return;
    if(a==='wmv'){
      var ix2=LANES.map(function(l){return l.id}).indexOf(t.lane)+(+el.dataset.d);
      if(ix2>=0&&ix2<LANES.length)t.lane=LANES[ix2].id;
    }else if(a==='wmin'){t.min=Math.max(5,t.min+(+el.dataset.d))}
    else if(a==='wprio'){t.prio=!t.prio}
    else if(a==='wdel'){m.tasks=m.tasks.filter(function(x){return x!==t});ui.wopen=null}
    toastW('');persist();renderWren();
  }
  wrenEl.addEventListener('click',function(e){
    var a=e.target.closest('[data-w]');
    if(a){wAct(a.dataset.w,a);return}
    var row=e.target.closest('.wt');
    if(row&&!e.target.closest('input,button')){ui.wopen=ui.wopen===row.dataset.t?null:row.dataset.t;renderWren()}
  });
  wrenEl.addEventListener('change',function(e){
    var t=e.target;
    if(t.classList.contains('wck')){
      var tk=mockTask(t.closest('.wt').dataset.t);
      if(tk){tk.done=t.checked;toastW('');persist();renderWren()}
      return;
    }
    if(t.id==='w-notes'){state.mock.notes[t.dataset.k]=t.value;persist();return}
    var s2=t.dataset&&t.dataset.s;
    if(!s2)return;
    var ms=t.closest('.mset'),proj=ms&&ms.dataset.k;
    if(!proj||!state.settings[proj])return;
    if(s2==='reduce')state.settings[proj].reduce=t.value;
    else if(s2==='lo'||s2==='hi'){
      var tg=state.targets[proj],v=Math.max(0,Math.round((parseFloat(t.value)||0)*2)/2);
      if(s2==='lo'){tg.lo=v;if(tg.hi<v)tg.hi=v}else{tg.hi=Math.max(v,tg.lo)}
    }else state.settings[proj][s2]=t.checked;
    persist();renderWren();
  });
  wrenEl.addEventListener('input',function(e){
    if(e.target.id==='w-notes')state.mock.notes[e.target.dataset.k]=e.target.value;
    else if(e.target.id==='w-quick')ui.wquick=e.target.value;
  });
  wrenEl.addEventListener('toggle',function(e){
    var d=e.target.dataset&&e.target.dataset.d;
    if(d==='notes')ui.wnotes=e.target.open;
    else if(d==='log')ui.wlog=e.target.open;
  },true);
  wrenEl.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.id==='wa-text'){e.preventDefault();wAct('wadd',e.target)}
    else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='w-quick'){
      e.preventDefault();
      var qb=wrenEl.querySelector('[data-w="quick"]');if(qb)wAct('quick',qb);
    }
  });
  var wDrag=null;
  wrenEl.addEventListener('dragstart',function(e){
    var r=e.target.closest&&e.target.closest('.wt');
    if(!r)return;
    wDrag=r.dataset.t;
    e.dataTransfer.effectAllowed='move';
    try{e.dataTransfer.setData('text/plain',wDrag)}catch(_){}
    r.classList.add('drag');
  });
  wrenEl.addEventListener('dragover',function(e){
    if(!wDrag)return;
    var b=e.target.closest('.lane-b'),dt=mockTask(wDrag);
    if(!b||!dt||b.dataset.k!==dt.project)return;
    e.preventDefault();
    e.dataTransfer.dropEffect='move';
    Array.prototype.forEach.call(wrenEl.querySelectorAll('.lane-b.over'),function(x){if(x!==b)x.classList.remove('over')});
    b.classList.add('over');
  });
  wrenEl.addEventListener('dragleave',function(e){
    var b=e.target.closest&&e.target.closest('.lane-b');
    if(b&&!(e.relatedTarget&&b.contains(e.relatedTarget)))b.classList.remove('over');
  });
  wrenEl.addEventListener('drop',function(e){
    if(!wDrag)return;
    var b=e.target.closest('.lane-b');
    var t=mockTask(wDrag);
    wDrag=null;
    if(!b||!t||b.dataset.k!==t.project){renderWren();return}
    e.preventDefault();
    var tgt2=e.target.closest('.wt');
    state.mock.tasks=state.mock.tasks.filter(function(x){return x!==t});
    t.lane=b.dataset.l;
    var idx=-1;
    if(tgt2&&tgt2.dataset.t!==t.id){state.mock.tasks.forEach(function(x,n){if(x.id===tgt2.dataset.t)idx=n})}
    if(idx>=0){var r=tgt2.getBoundingClientRect();if(e.clientY>r.top+r.height/2)idx++;state.mock.tasks.splice(idx,0,t)}
    else state.mock.tasks.push(t);
    toastW('');persist();renderWren();
  });
  wrenEl.addEventListener('dragend',function(){
    wDrag=null;
    Array.prototype.forEach.call(wrenEl.querySelectorAll('.drag,.over'),function(x){x.classList.remove('drag');x.classList.remove('over')});
  });

  /* ---------- Reiter ---------- */
  function applyTab(name){
    ui.tab=name;
    try{localStorage.setItem('metaplan-tab',name)}catch(e){}
    var w=name==='wren';
    app.hidden=w;listsEl.hidden=w;histEl.hidden=w;wrenEl.hidden=!w;
    Array.prototype.forEach.call(tabsEl.querySelectorAll('button'),function(b){b.setAttribute('aria-selected',String(b.dataset.tab===name))});
    closeCtx();
    if(w)renderWren();else{render();renderLists();renderHistory()}
    renderDock();
    window.scrollTo(0,0);
  }
  tabsEl.addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]');
    if(b&&b.dataset.tab!==ui.tab)applyTab(b.dataset.tab);
  });
  function restoreTab(){
    try{if(localStorage.getItem('metaplan-tab')==='wren')applyTab('wren')}catch(e){}
  }

  /* ---------- Fortschritt am Block ---------- */
  function track(b,cv,big){
    var n=Math.max(1,Math.round(b.hours*2)),on=Math.floor(cv*2+1e-9),cells='';
    for(var i=0;i<n;i++)cells+='<i'+(i<on?' class="on"':'')+'></i>';
    return '<div class="bp'+(n>12?' solid':'')+(big?' big':'')+'" data-id="'+b.id+'" data-n="'+n+'" role="group" title="Antippen setzt den Fortschritt" aria-label="Fortschritt '+fmt(cv)+' von '+fmt(b.hours)+' Stunden">'+cells+'</div>';
  }
  function trackClick(tr,e){
    var b=blockById(tr.dataset.id);
    if(!b)return;
    var n=+tr.dataset.n,r=tr.getBoundingClientRect();
    var idx=Math.min(n,Math.max(1,Math.ceil((e.clientX-r.left)/r.width*n)));
    var cur=Math.floor((compute().cov[b.id]||0)*2+1e-9);
    setProgress(b,(idx===cur?idx-1:idx)*0.5);
    commit();
  }

  /* ---------- Fokus nach dem Neuzeichnen zurückgeben ---------- */
  function focusKey(){
    var a=document.activeElement;
    if(!a||a===document.body||!(app.contains(a)||dockEl.contains(a)))return null;
    var d=a.dataset||{};
    return {id:a.id||'',act:d.act||'',bid:d.id||'',d:d.d,k:d.k,blk:!!(a.classList&&a.classList.contains('blk'))};
  }
  function restoreFocus(k){
    if(!k)return;
    var sel=null;
    if(k.id)sel='#'+k.id;
    else if(k.act)sel='[data-act="'+k.act+'"]'+(k.bid?'[data-id="'+k.bid+'"]':'')+(k.d!=null?'[data-d="'+k.d+'"]':'')+(k.k?'[data-k="'+k.k+'"]':'');
    else if(k.blk&&k.bid)sel='.blk[data-id="'+k.bid+'"]';
    if(!sel)return;
    var el=null;
    try{el=document.querySelector(sel)}catch(err){}
    if(el&&el!==document.activeElement){try{el.focus({preventScroll:true})}catch(err){}}
  }

  /* ---------- Bearbeiten-Leiste, unten angedockt ---------- */
  function flushTitle(){
    var b=selected(),ti=document.getElementById('ed-title');
    if(b&&ti&&ti.value.trim()!==b.title){b.title=ti.value.trim();persist()}
  }
  function renderDock(){
    var b=selected();
    if(!b||ui.tab==='wren'){dockEl.hidden=true;dockEl.innerHTML='';pageEl.style.paddingBottom='';return}
    var c=compute(),p=P[b.project],cv=c.cov[b.id]||0,full=cv>=b.hours-1e-9;
    var dis=b.fixed?' disabled':'';
    var projO=ORDER.map(function(k){return [k,P[k].name]});
    var dayO=DAYS.map(function(d,i){return [i,d.n]});
    dockEl.style.setProperty('--c','var(--'+b.project+')');
    dockEl.hidden=false;
    dockEl.innerHTML='<div class="dk-in">'+
      '<div class="dk-h"><span class="dot" style="background:var(--c)"></span><b>'+p.name+'</b><span class="dk-sub">'+DAYS[b.day].n+' · '+fmt(b.hours)+' h'+(b.fixed?' · fester Termin':'')+'</span>'+
      '<button class="btn sm" data-act="close">✕ Schließen</button></div>'+
      '<div class="dk-body">'+
        '<div class="dk-prog"><div class="dk-num"><b class="num">'+fmt(cv)+'</b><span class="of">von '+fmt(b.hours)+' h gearbeitet</span></div>'+track(b,cv,true)+
          '<div class="dk-btns">'+
          '<button class="btn" data-act="bp" data-id="'+b.id+'" data-d="-0.5"'+(cv<=1e-9?' disabled':'')+'>− 0,5</button>'+
          '<button class="btn" data-act="bp" data-id="'+b.id+'" data-d="0.5"'+(full?' disabled':'')+'>+ 0,5</button>'+
          '<button class="btn" data-act="bp" data-id="'+b.id+'" data-d="1"'+(full?' disabled':'')+'>+ 1 h</button>'+
          '<button class="btn primary" data-act="bfull" data-id="'+b.id+'"'+(full?' disabled':'')+'>✓ Voll</button></div></div>'+
        '<div class="dk-edit">'+
          '<label class="f"><span>Titel</span><input id="ed-title" value="'+esc(b.title)+'" maxlength="40" placeholder="ohne Titel"></label>'+
          '<div class="f"><span>Dauer</span><div class="step"><button class="btn sq" data-act="dm" aria-label="30 Minuten weniger">−</button><b class="num">'+fmt(b.hours)+' h</b><button class="btn sq" data-act="dp" aria-label="30 Minuten mehr">+</button></div></div>'+
          '<label class="f"><span>Tag</span><select id="ed-day"'+dis+'>'+opts(dayO,b.day)+'</select></label>'+
          '<label class="f"><span>Projekt</span><select id="ed-proj"'+dis+'>'+opts(projO,b.project)+'</select></label>'+
          '<button class="btn" data-act="del"'+dis+'>Löschen</button>'+
          (b.fixed?'<span class="note">Fester Termin: Tag und Projekt bleiben.</span>':'')+
        '</div></div></div>';
    pageEl.style.paddingBottom=(dockEl.offsetHeight+24)+'px';
  }
  dockEl.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]');
    if(a&&!a.disabled){act(a.dataset.act,a);return}
    var tr=e.target.closest('.bp');
    if(tr)trackClick(tr,e);
  });

  /* ---------- Kontextmenü: Rechtsklick, langes Drücken, ⋯ ---------- */
  var ctxFor=null,ctxT=0,lpTimer=null,lpFired=false;
  function openCtx(id,x,y){
    var b=blockById(id);
    if(!b)return;
    var cv=compute().cov[id]||0,full=cv>=b.hours-1e-9;
    ctxFor=id;ctxT=Date.now();
    ctxEl.innerHTML=
      '<button role="menuitem" data-act="edit" data-id="'+id+'">Bearbeiten</button>'+
      '<button role="menuitem" data-act="bfull" data-id="'+id+'"'+(full?' disabled':'')+'>Als erledigt eintragen</button>'+
      '<button role="menuitem" data-act="breset" data-id="'+id+'"'+(cv<=1e-9?' disabled':'')+'>Fortschritt zurücksetzen</button><hr>'+
      '<button role="menuitem" class="danger" data-act="del" data-id="'+id+'"'+(b.fixed?' disabled':'')+'>Löschen</button>';
    ctxEl.hidden=false;
    var w=ctxEl.offsetWidth,h=ctxEl.offsetHeight;
    ctxEl.style.left=Math.max(8,Math.min(x,window.innerWidth-w-8))+'px';
    ctxEl.style.top=Math.max(8,Math.min(y,window.innerHeight-h-8))+'px';
    var first=ctxEl.querySelector('button:not(:disabled)');
    if(first)first.focus({preventScroll:true});
  }
  function closeCtx(restore){
    if(ctxEl.hidden)return;
    var id=ctxFor;
    ctxEl.hidden=true;ctxEl.innerHTML='';ctxFor=null;
    if(restore&&id){var bl=document.querySelector('.blk[data-id="'+id+'"]');if(bl)bl.focus({preventScroll:true})}
  }
  ctxEl.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]');
    if(!a||a.disabled||Date.now()-ctxT<350)return;
    closeCtx();
    act(a.dataset.act,a);
  });
  ctxEl.addEventListener('keydown',function(e){
    var items=Array.prototype.slice.call(ctxEl.querySelectorAll('button:not(:disabled)'));
    var i=items.indexOf(document.activeElement);
    if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
    else if(e.key==='Tab'){closeCtx()}
  });
  app.addEventListener('contextmenu',function(e){
    var bl=e.target.closest('.blk');
    if(!bl){closeCtx();return}
    if(e.target.closest('input,select,textarea'))return;
    e.preventDefault();
    var x=e.clientX,y=e.clientY;
    if(!x&&!y){var r=bl.getBoundingClientRect();x=r.left+24;y=r.top+24}
    openCtx(bl.dataset.id,x,y);
  });
  app.addEventListener('touchstart',function(e){
    var bl=e.target.closest&&e.target.closest('.blk');
    clearTimeout(lpTimer);
    if(!bl||e.touches.length!==1||e.target.closest('button,.bp'))return;
    var t=e.touches[0],id=bl.dataset.id,x=t.clientX,y=t.clientY;
    lpTimer=setTimeout(function(){lpTimer=null;lpFired=true;openCtx(id,x,y)},550);
  },{passive:true});
  app.addEventListener('touchmove',function(){clearTimeout(lpTimer);lpTimer=null},{passive:true});
  app.addEventListener('touchcancel',function(){clearTimeout(lpTimer);lpTimer=null},{passive:true});
  app.addEventListener('touchend',function(e){
    clearTimeout(lpTimer);lpTimer=null;
    if(lpFired){lpFired=false;e.preventDefault()}
  },{passive:false});
  document.addEventListener('click',function(e){
    if(ctxEl.hidden)return;
    if(ctxEl.contains(e.target)||(e.target.closest&&e.target.closest('[data-act="menu"]')))return;
    closeCtx();
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!ctxEl.hidden){closeCtx(true);return}
    if(ui.sel){flushTitle();ui.sel=null;render()}
  });
  window.addEventListener('resize',function(){
    closeCtx();
    if(ui.sel&&!dockEl.hidden)pageEl.style.paddingBottom=(dockEl.offsetHeight+24)+'px';
  });
  window.addEventListener('scroll',function(){closeCtx()},true);
  window.addEventListener('blur',function(){closeCtx()});

  document.addEventListener('visibilitychange',function(){
    if(!document.hidden&&rollWeek()){persist();renderAll()}
  });

  restoreTab();
  renderAll();
  initCloud();
})();
</script>

</body></html>
