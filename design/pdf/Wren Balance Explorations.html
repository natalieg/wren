document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

(--accent-primary); text-decoration: none; border-bottom: 1px dotted var(--violet-300); }\na:hover { color: var(--violet-600); }\n@keyframes wrenTwinkle { 0%,100% { opacity:1 } 50% { opacity:.3 } }\n@keyframes wrenTip { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(-2deg) } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-theme=\"{{ theme }}\" style=\"background:var(--bg-base); color:var(--text-primary); font-family:var(--font-body); padding:56px 48px 96px; min-height:100vh;\">\n\n<div style=\"display:flex; flex-direction:column; gap:10px; max-width:920px; margin-bottom:48px;\">\n  <div style=\"font-family:var(--font-body); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted);\">Wren ✦ exploration 2<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-display); font-size:44px; line-height:1.1; margin:0; color:var(--text-primary);\">Balance you can see<\u002Fh1>\n  <p style=\"font-family:var(--font-body); font-size:16px; line-height:1.6; color:var(--text-secondary); margin:0; max-width:760px; text-wrap:pretty;\">Life areas instead of one flat list, and the week — not the day — as the unit that has to balance. Vocabulary first (what an area is, what \"enough\" means), then seven ways of making the week's shape visible, then two assembled views. Reference any sketch by its id in chat.<\u002Fp>\n  <p style=\"font-family:var(--font-body); font-size:14px; line-height:1.6; color:var(--text-muted); margin:6px 0 0; max-width:760px; text-wrap:pretty;\">One stance runs through all of it: an area has a <strong>band<\u002Fstrong> (\"2–4 times this week\"), never a quota. Under the band is dim, not red — the only failure state Wren shows is <em>silence<\u002Fem>, an area you haven't touched in a while.<\u002Fp>\n<\u002Fdiv>\n\n<section style=\"display:flex; flex-direction:column; gap:56px;\">\n\n  <div style=\"display:flex; flex-direction:column; gap:20px;\">\n    <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1.5px solid var(--border-soft); padding-bottom:10px;\">\n      <h2 style=\"font-family:var(--font-heading); font-size:22px; margin:0; letter-spacing:.04em;\">✦ Vocabulary<\u002Fh2>\n      <span style=\"font-size:13px; color:var(--text-muted);\">what a life area is, before it's a chart<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;\">\n\n      <div id=\"1a\" style=\"display:flex; flex-direction:column; gap:10px; width:440px;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"font-family:var(--font-retro); font-size:16px; background:var(--violet-500); color:#fff; border-radius:var(--radius-pill); padding:1px 10px;\">1a<\u002Fspan>\n          <strong style=\"font-size:15px;\">Area anatomy<\u002Fstrong>\n          <span style=\"font-size:12px; color:var(--text-muted);\">need vs want<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-sunken); border-radius:var(--radius-lg); padding:18px; display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--border-soft); border-left:5px solid var(--violet-400); border-radius:var(--radius-md); padding:12px 16px; box-shadow:var(--shadow-sm);\">\n            <span style=\"font-size:16px; color:var(--violet-500);\">◈<\u002Fspan>\n            <span style=\"flex:1; font-weight:700; font-size:15px;\">Work<\u002Fspan>\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--plum-600); background:var(--plum-200); border-radius:var(--radius-pill); padding:3px 9px;\">need<\u002Fspan>\n            <span style=\"font-family:var(--font-retro); font-size:17px; color:var(--text-secondary);\">18–26h / wk<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--border-soft); border-left:5px solid var(--mint-400); border-radius:var(--radius-md); padding:12px 16px; box-shadow:var(--shadow-sm);\">\n            <span style=\"font-size:16px; color:var(--mint-600);\">✎<\u002Fspan>\n            <span style=\"flex:1; font-weight:700; font-size:15px;\">Drawing<\u002Fspan>\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mint-600); background:var(--mint-100); border-radius:var(--radius-pill); padding:3px 9px;\">want<\u002Fspan>\n            <span style=\"font-family:var(--font-retro); font-size:17px; color:var(--text-secondary);\">2–4× / wk<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--border-soft); border-left:5px solid var(--sky-400); border-radius:var(--radius-md); padding:12px 16px; box-shadow:var(--shadow-sm);\">\n            <span style=\"font-size:16px; color:var(--sky-500);\">✧<\u002Fspan>\n            <span style=\"flex:1; font-weight:700; font-size:15px;\">Exercise<\u002Fspan>\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sky-500); background:var(--sky-100); border-radius:var(--radius-pill); padding:3px 9px;\">growing<\u002Fspan>\n            <span style=\"font-family:var(--font-retro); font-size:17px; color:var(--text-secondary);\">12m × 5 days<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5;\">Colour + glyph + a band. Three kinds only: <strong>need<\u002Fstrong> (has to happen), <strong>want<\u002Fstrong> (you'd like it to), <strong>growing<\u002Fstrong> (a habit on a ramp). Nothing in Wren asks for a percentage.<\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"1b\" style=\"display:flex; flex-direction:column; gap:10px; width:440px;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"font-family:var(--font-retro); font-size:16px; background:var(--violet-500); color:#fff; border-radius:var(--radius-pill); padding:1px 10px;\">1b<\u002Fspan>\n          <strong style=\"font-size:15px;\">The band, not the target<\u002Fstrong>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-sunken); border-radius:var(--radius-lg); padding:22px; display:flex; flex-direction:column; gap:18px;\">\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"display:flex; align-items:baseline; gap:8px; font-size:13px;\"><span style=\"font-weight:700;\">Cleaning<\u002Fspan><span style=\"color:var(--text-muted); font-size:12px;\">enough is a range<\u002Fspan><span style=\"margin-left:auto; font-family:var(--font-retro); font-size:16px; color:var(--peach-500);\">90m so far<\u002Fspan><\u002Fdiv>\n            <div style=\"position:relative; height:26px; background:var(--surface); border:1.5px solid var(--border-soft); border-radius:var(--radius-pill); overflow:hidden;\">\n              <span style=\"position:absolute; top:0; bottom:0; left:40%; width:30%; background:var(--peach-100);\"><\u002Fspan>\n              <span style=\"position:absolute; top:0; bottom:0; left:0; width:48%; background:var(--peach-300); border-radius:var(--radius-pill);\"><\u002Fspan>\n              <span style=\"position:absolute; top:0; bottom:0; left:40%; width:1.5px; background:var(--peach-500);\"><\u002Fspan>\n              <span style=\"position:absolute; top:0; bottom:0; left:70%; width:1.5px; background:var(--peach-500);\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; font-size:11px; color:var(--text-muted); font-family:var(--font-retro); font-size:14px;\"><span style=\"margin-left:40%;\">1h<\u002Fspan><span style=\"margin-left:auto; padding-right:26%;\">2h<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--text-secondary); line-height:1.55; text-wrap:pretty;\">Inside the band you're done — going further is neither praised nor punished. That's what stops \"I need to do everything\": there's a ceiling as well as a floor.<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5;\">The pale block is the band; the solid bar is where you are. A single number invites overshoot, a band tells you when to stop.<\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"1c\" style=\"display:flex; flex-direction:column; gap:10px; width:440px;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"font-family:var(--font-retro); font-size:16px; background:var(--violet-500); color:#fff; border-radius:var(--radius-pill); padding:1px 10px;\">1c<\u002Fspan>\n          <strong style=\"font-size:15px;\">Growing habit<\u002Fstrong>\n          <span style=\"font-size:12px; color:var(--text-muted);\">the ramp, and who moves it<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-sunken); border-radius:var(--radius-lg); padding:20px; display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; align-items:flex-end; gap:6px; height:96px;\">\n            <span style=\"flex:1; height:22%; background:var(--sky-200); border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"flex:1; height:30%; background:var(--sky-200); border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"flex:1; height:30%; background:var(--sky-300); border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"flex:1; height:44%; background:var(--sky-300); border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"flex:1; height:44%; background:var(--sky-400); border-radius:4px 4px 0 0;\"><\u002Fspan>\n            <span style=\"flex:1; height:60%; background:var(--sky-400); border-radius:4px 4px 0 0; box-shadow:var(--glow-accent);\"><\u002Fspan>\n            <span style=\"flex:1; height:74%; background:repeating-linear-gradient(45deg, var(--sky-200) 0 5px, transparent 5px 10px); border:1.5px dashed var(--sky-400); border-bottom:none; border-radius:4px 4px 0 0;\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; font-family:var(--font-retro); font-size:14px; color:var(--text-muted); gap:6px;\">\n            <span style=\"flex:1; text-align:center;\">5m<\u002Fspan><span style=\"flex:1; text-align:center;\">7m<\u002Fspan><span style=\"flex:1; text-align:center;\">7m<\u002Fspan><span style=\"flex:1; text-align:center;\">10m<\u002Fspan><span style=\"flex:1; text-align:center;\">10m<\u002Fspan><span style=\"flex:1; text-align:center; color:var(--sky-500);\">12m<\u002Fspan><span style=\"flex:1; text-align:center;\">14m?<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface); border:1.5px solid var(--border-soft); border-radius:var(--radius-md); padding:12px 14px; display:flex; align-items:center; gap:12px;\">\n            <span style=\"flex:1; font-size:13px; line-height:1.5; color:var(--text-secondary);\">Six weeks at exercise. Ready to try <strong>14 minutes<\u002Fstrong> next week?<\u002Fspan>\n            <span style=\"display:flex; gap:6px;\">\n              <span style=\"font-size:12px; font-weight:700; color:var(--text-on-accent); background:var(--accent-primary); border-radius:var(--radius-pill); padding:4px 12px; cursor:pointer;\">yes<\u002Fspan>\n              <span style=\"font-size:12px; font-weight:700; color:var(--text-secondary); border:1.5px solid var(--border-soft); border-radius:var(--radius-pill); padding:4px 12px; cursor:pointer;\">stay here<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5;\">Growth is <em>offered<\u002Fem> weekly, never automatic — and \"stay here\" is a real answer, not a snooze. A missed week never resets the ramp; it just doesn't ask that week.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex-direction:column; gap:20px;\">\n    <div style=\"display:flex; align-items:baseline; gap:14px; border-bottom:1.5px solid var(--border-soft); padding-bottom:10px;\">\n      <h2 style=\"font-family:var(--font-heading); font-size:22px; margin:0; letter-spacing:.04em;\">✧ Making the week visible<\u002Fh2>\n      <span style=\"font-size:13px; color:var(--text-muted);\">seven shapes for the same week — {{ weekLabel }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;\">\n\n      <div id=\"1d\" style=\"display:flex; flex-direction:column; gap:10px; width:400px;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"font-family:var(--font-retro); font-size:16px; background:var(--violet-500); color:#fff; border-radius:var(--radius-pill); padding:1px 10px;\">1d<\u002Fspan>\n          <strong style=\"font-size:15px;\">Orbits<\u002Fstrong>\n          <span style=\"font-size:12px; color:var(--text-muted);\">one ring per area<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-sunken); border-radius:var(--radius-lg); padding:22px; display:flex; flex-direction:column; align-items:center; gap:16px;\">\n          <div style=\"position:relative; width:330px; height:330px;\">\n            <div style=\"position:absolute; inset:0; border-radius:50%; background:conic-gradient(from -90deg, var(--violet-400) 0 74%, var(--plum-200) 74% 100%); mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%); -webkit-mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:22px; border-radius:50%; background:conic-gradient(from -90deg, var(--sky-400) 0 55%, var(--plum-200) 55% 100%); mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%); -webkit-mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:44px; border-radius:50%; background:conic-gradient(from -90deg, var(--peach-400) 0 62%, var(--plum-200) 62% 100%); mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%); -webkit-mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:66px; border-radius:50%; background:conic-gradient(from -90deg, var(--mint-400) 0 25%, var(--plum-200) 25% 100%); mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%); -webkit-mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:88px; border-radius:50%; background:conic-gradient(from -90deg, var(--gold-400) 0 8%, var(--plum-200) 8% 100%); mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%); -webkit-mask:radial-gradient(closest-side, transparent 0 calc(100% - 15px), #000 calc(100% - 14px) 100%);\"><\u002Fdiv>\n            <div style=\"position:absolute; inset:110px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:1.5px solid var(--border-soft);\">\n              <span style=\"font-family:var(--font-retro); font-size:26px; line-height:1; color:var(--text-primary);\">{{ weekShort }}<\u002Fspan>\n              <span style=\"font-size:11px; color:var(--text-muted); text-align:center; line-height:1.3; max-width:88px;\">3 of 5 in band<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:absolute; top:-2px; left:50%; width:2px; height:112px; background:var(--plum-600); opacity:.35;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; justify-content:center; font-size:12px;\">\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:var(--violet-400);\"><\u002Fspan>work<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:var(--sky-400);\"><\u002Fspan>exercise<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:var(--peach-400);\"><\u002Fspan>cleaning<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:var(--mint-400);\"><\u002Fspan>drawing<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:5px;\"><span style=\"width:9px; height:9px; border-radius:50%; background:var(--gold-400);\"><\u002Fspan>journaling<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13px; color:var(--text-secondary); margin:0; line-height:1.5;\">Each ring fills clockwise toward its own band, so \"balanced\" looks like rings ending near the same angle — not like equal amounts of time. Beautiful, but hard to read exact numbers off.<\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"1e\" style=\"display:flex; flex-direction:column; gap:10px; width:560px;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"font-family:var(--font-retro); font-size:16px; background:var(--violet-500); color:#fff; border-radius:var(--radius-pill); padding:1px 10px;\">1e<\u002Fspan>\n          <strong style=\"font-size:15px;\">Area × day grid<\u002Fstrong>\n          <span style=\"font-size:12px; color:var(--text-muted);\">the workhorse<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--bg-sunken); border-radius:var(--radius-lg); padding:20px; display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:grid; grid-template-columns:112px repeat(7, 1fr) 84px; gap:6px; align-items:center; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted);\">\n            <span><\u002Fspan><span style=\"text-align:center;\">m<\u002Fspan><span style=\"text-align:center;\">t<\u002Fspan><span style=\"text-align:center;\">w<\u002Fspan><span style=\"text-align:center;\">t<\u002Fspan><span style=\"text-align:center;\">f<\u002Fspan><span style=\"text-align:center;\">s<\u002Fspan><span style=\"text-align:center;\">s<\u002Fspan><span style=\"text-align:right;\">week<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:112px repeat(7, 1fr) 84px; gap:6px; align-items:center;\">\n            <span style=\"display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600;\"><span style=\"color:var(--violet-500);\">◈<\u002Fspan>Work<\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--violet-400);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--violet-500);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--violet-300);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--violet-400);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--violet-200);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--plum-200);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:repeating-linear-gradient(45deg, var(--violet-200) 0 5px, transparent 5px 10px); border:1.5px dashed var(--border-soft);\"><\u002Fspan>\n            <span style=\"text-align:right; font-family:var(--font-retro); font-size:16px; color:var(--text-secondary);\">21h ✓<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:112px repeat(7, 1fr) 84px; gap:6px; align-items:center;\">\n            <span style=\"display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600;\"><span style=\"color:var(--sky-500);\">✧<\u002Fspan>Exercise<\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--sky-400);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--plum-200);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--sky-400);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--sky-300);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--plum-200);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--sky-400);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:repeating-linear-gradient(45deg, var(--sky-200) 0 5px, transparent 5px 10px); border:1.5px dashed var(--border-soft);\"><\u002Fspan>\n            <span style=\"text-align:right; font-family:var(--font-retro); font-size:16px; color:var(--text-secondary);\">4× ✓<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:112px repeat(7, 1fr) 84px; gap:6px; align-items:center;\">\n            <span style=\"display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600;\"><span style=\"color:var(--peach-500);\">⁛<\u002Fspan>Cleaning<\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--peach-300);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--plum-200);\"><\u002Fspan>\n            <span style=\"height:30px; border-radius:6px; background:var(--peach-400);\"><\u002
